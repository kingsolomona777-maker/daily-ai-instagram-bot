name: Orom Plan1 Daily Package Integration Test

on:
  workflow_dispatch:

jobs:
  daily-package-integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required Python packages
        run: |
          pip install Pillow google-genai

      - name: Compile project files
        env:
          GEMINI_API_KEY: test-key-not-used
        run: |
          python -m py_compile daily_content_engine.py
          python -m py_compile daily_package_manager.py

      - name: Test engine to package manager connection
        env:
          GEMINI_API_KEY: test-key-not-used
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import json

          import daily_content_engine as engine
          from daily_package_manager import build_daily_package

          output_dir = Path("integration_test_media")
          package_root = Path("integration_test_packages")

          shutil.rmtree(output_dir, ignore_errors=True)
          shutil.rmtree(package_root, ignore_errors=True)

          output_dir.mkdir(parents=True)

          # ---------------------------------------------------------
          # Fake Gemini content generation.
          # ---------------------------------------------------------

          def fake_generate_content_batches(daily_plan):
              posts = []

              lesson_types = [
                  "problem_and_cause",
                  "how_it_works",
                  "common_mistake",
                  "professional_tip",
                  "troubleshooting",
                  "maintenance",
                  "installation_principle",
                  "material_knowledge",
                  "myth_vs_fact",
                  "professional_tip",
              ]

              for item in daily_plan:
                  slot = item["slot"]
                  is_reel = slot % 2 == 1

                  posts.append({
                      "slot": slot,
                      "lesson_number": slot,
                      "content_type": (
                          "reel"
                          if is_reel
                          else "educational_visual"
                      ),
                      "role": item["role"],
                      "lesson_type": lesson_types[slot - 1],
                      "knowledge_path": item["knowledge_path"],
                      "knowledge_area": item["knowledge_area"],
                      "title": (
                          f"Integration Test Plumbing Lesson {slot}"
                      ),
                      "description": (
                          f"A realistic educational plumbing lesson "
                          f"created for integration testing, lesson {slot}."
                      ),
                      "image_prompt": (
                          "Professional realistic plumbing installation "
                          "photograph showing physically accurate pipe "
                          "connections, realistic fittings and a clean "
                          "working environment, no text, no logo, no watermark."
                      ),
                      "hashtags": [
                          "#plumbing",
                          "#plumbingtips",
                          "#plumbingeducation",
                          "#plumber",
                      ],
                      "visual_story": (
                          "The visual clearly demonstrates the plumbing "
                          "principle being taught so the viewer can "
                          "understand the lesson from the image."
                      ),
                      "on_image_text": {
                          "hook": f"Plumbing Lesson {slot}",
                          "explanation": (
                              "Understand the plumbing principle."
                          ),
                          "callout": (
                              "Key component or cause"
                          ),
                          "takeaway": (
                              "Use the correct professional practice."
                          ),
                      },
                  })

              return posts

          engine.generate_content_batches = (
              fake_generate_content_batches
          )

          # ---------------------------------------------------------
          # Fake Cloudflare image generation.
          # ---------------------------------------------------------

          def fake_generate_image(prompt, output_file):
              output_file = Path(output_file)

              from PIL import Image

              image = Image.new(
                  "RGB",
                  (1024, 1024),
                  "white",
              )

              image.save(
                  output_file,
                  format="JPEG",
              )

              return str(output_file)

          engine.generate_image = fake_generate_image

          # ---------------------------------------------------------
          # Fake vertical educational image preparation.
          # ---------------------------------------------------------

          def fake_make_vertical_image(
              input_file,
              output_file,
              on_image_text=None,
          ):
              output_file = Path(output_file)

              from PIL import Image

              image = Image.open(input_file).convert("RGB")
              image = image.resize((1080, 1920))

              image.save(
                  output_file,
                  format="JPEG",
              )

              return str(output_file)

          engine.make_vertical_image = fake_make_vertical_image

          # ---------------------------------------------------------
          # Fake Reel generation.
          # ---------------------------------------------------------

          def fake_generate_reel(
              input_file,
              output_file,
              duration=8,
              teaching_text=None,
              audio_file=None,
          ):
              output_file = Path(output_file)

              output_file.write_bytes(
                  b"fake-reel-media-for-integration-test"
              )

              return str(output_file)

          engine.generate_reel = fake_generate_reel

          # ---------------------------------------------------------
          # Create the normal 10-slot daily plan.
          # ---------------------------------------------------------

          daily_plan = []

          lesson_types = [
              "problem_and_cause",
              "how_it_works",
              "common_mistake",
              "professional_tip",
              "troubleshooting",
              "maintenance",
              "installation_principle",
              "material_knowledge",
              "myth_vs_fact",
              "professional_tip",
          ]

          roles = [
              "problem_and_cause",
              "how_it_works",
              "common_mistake",
              "professional_tip",
              "troubleshooting",
              "maintenance",
              "installation_principle",
              "material_knowledge",
              "myth_vs_fact",
              "professional_tip",
          ]

          for slot in range(1, 11):
              daily_plan.append({
                  "slot": slot,
                  "lesson_number": slot,
                  "content_type": (
                      "reel"
                      if slot % 2 == 1
                      else "educational_visual"
                  ),
                  "role": roles[slot - 1],
                  "lesson_type": lesson_types[slot - 1],
                  "knowledge_path": (
                      "Drainage Fundamentals"
                  ),
                  "knowledge_area": "Plumbing",
              })

          # ---------------------------------------------------------
          # Generate the 10 lessons.
          # ---------------------------------------------------------

          generated_content = (
              engine.generate_content_batches(
                  daily_plan
              )
          )

          assert len(generated_content) == 10

          # ---------------------------------------------------------
          # Generate all 10 media assets.
          # ---------------------------------------------------------

          media_packages = (
              engine.generate_media_from_content(
                  generated_content=generated_content,
                  output_directory=output_dir,
                  audio_file=None,
              )
          )

          assert len(media_packages) == 10

          # ---------------------------------------------------------
          # Combine each generated lesson with its media files.
          #
          # The media engine returns media information separately.
          # The lesson content remains in generated_content.
          # ---------------------------------------------------------

          package_posts = []

          for index, media in enumerate(
              media_packages
          ):
              content = generated_content[index]

              package_posts.append({
                  **content,
                  "slot": index + 1,
                  "image_file": str(
                      media["image_file"]
                  ),
                  "reel_file": (
                      str(media["reel_file"])
                      if media.get("reel_file")
                      else None
                  ),
                  "reel_audio_file": (
                      str(media["reel_audio_file"])
                      if media.get("reel_audio_file")
                      else None
                  ),
              })

          assert len(package_posts) == 10

          # ---------------------------------------------------------
          # Build the daily package.
          # ---------------------------------------------------------

          package_dir = build_daily_package(
              generated_posts=package_posts,
              package_date="2099-01-02",
              package_root=package_root,
          )

          schedule_file = package_dir / "schedule.json"

          assert schedule_file.exists()

          schedule = json.loads(
              schedule_file.read_text()
          )

          assert schedule["status"] == "ready"
          assert schedule["total_posts"] == 10
          assert schedule["reels"] == 5
          assert schedule["educational_visuals"] == 5
          assert len(schedule["schedule"]) == 10

          post_dirs = sorted(
              package_dir.glob("post_*")
          )

          assert len(post_dirs) == 10

          reel_count = 0
          visual_count = 0

          for post_dir in post_dirs:

              assert (
                  post_dir / "image.jpg"
              ).exists()

              content_file = (
                  post_dir / "content.json"
              )

              assert content_file.exists()

              content = json.loads(
                  content_file.read_text()
              )

              assert (
                  content["publication_status"]
                  == "pending"
              )

              if content["content_type"] == "reel":
                  reel_count += 1

                  assert (
                      post_dir / "reel.mp4"
                  ).exists()
              else:
                  visual_count += 1

          assert reel_count == 5
          assert visual_count == 5

          print("")
          print("========================================")
          print("DAILY PACKAGE INTEGRATION TEST PASSED")
          print("========================================")
          print("10 lessons generated")
          print("10 media packages created")
          print("5 Reels created")
          print("5 educational visuals created")
          print("10 posts packaged")
          print("Package status: READY")
          print("Publication status: PENDING")
          print("Gemini: NOT USED")
          print("Cloudflare FLUX: NOT USED")
          print("Instagram: NOT USED")
          print("========================================")

          PY

      - name: Clean integration test files
        if: always()
        run: |
          rm -rf integration_test_media
          rm -rf integration_test_packages
