name: Orom Plan1 Gemini 3 Pair Fallback Test

on:
  workflow_dispatch:

jobs:
  gemini-three-pair-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U google-genai

      - name: Test 3 real content pairs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from content_batch_generator import generate_content_pair

          plans = [
              (
                  {
                      "slot": 1,
                      "role": "Problem Detective",
                      "lesson_type": "problem_and_cause",
                      "knowledge_path": "Drainage Fundamentals",
                      "knowledge_area": "drainage",
                      "lesson_number": 1,
                      "content_type": "reel",
                  },
                  {
                      "slot": 2,
                      "role": "Plumbing Teacher",
                      "lesson_type": "how_it_works",
                      "knowledge_path": "Drainage Fundamentals",
                      "knowledge_area": "drainage",
                      "lesson_number": 2,
                      "content_type": "educational_visual",
                  },
              ),
              (
                  {
                      "slot": 3,
                      "role": "Plumbing Mistakes",
                      "lesson_type": "common_mistake",
                      "knowledge_path": "Bathroom Plumbing",
                      "knowledge_area": "bathroom",
                      "lesson_number": 3,
                      "content_type": "reel",
                  },
                  {
                      "slot": 4,
                      "role": "Professional Knowledge",
                      "lesson_type": "professional_tip",
                      "knowledge_path": "Bathroom Plumbing",
                      "knowledge_area": "bathroom",
                      "lesson_number": 4,
                      "content_type": "educational_visual",
                  },
              ),
              (
                  {
                      "slot": 5,
                      "role": "Troubleshooting Teacher",
                      "lesson_type": "troubleshooting",
                      "knowledge_path": "Water Supply Fundamentals",
                      "knowledge_area": "water_supply",
                      "lesson_number": 5,
                      "content_type": "reel",
                  },
                  {
                      "slot": 6,
                      "role": "Maintenance Teacher",
                      "lesson_type": "maintenance",
                      "knowledge_path": "Water Supply Fundamentals",
                      "knowledge_area": "water_supply",
                      "lesson_number": 6,
                      "content_type": "educational_visual",
                  },
              ),
          ]

          all_lessons = []

          for pair_number, (first, second) in enumerate(
              plans,
              start=1,
          ):
              print("")
              print("========================================")
              print(f"TESTING PAIR {pair_number}/3")
              print("========================================")

              results = generate_content_pair(
                  first,
                  second,
              )

              if len(results) != 2:
                  raise RuntimeError(
                      f"Pair {pair_number} returned "
                      f"{len(results)} lessons instead of 2."
                  )

              for lesson_number, lesson in enumerate(
                  results,
                  start=1,
              ):
                  required = [
                      "title",
                      "description",
                      "image_prompt",
                      "hashtags",
                      "visual_story",
                      "on_image_text",
                      "lesson_type",
                      "content_type",
                      "knowledge_area",
                      "lesson_number",
                  ]

                  missing = [
                      field
                      for field in required
                      if field not in lesson
                  ]

                  if missing:
                      raise RuntimeError(
                          f"Pair {pair_number}, lesson "
                          f"{lesson_number} is missing: "
                          f"{missing}"
                      )

                  print(
                      f"Lesson {lesson_number}: "
                      f"{lesson['title']}"
                  )

                  print(
                      f"Model used: "
                      f"{lesson.get('_model_used', 'unknown')}"
                  )

                  all_lessons.append(lesson)

              print(
                  f"PAIR {pair_number} PASSED"
              )

          if len(all_lessons) != 6:
              raise RuntimeError(
                  f"Expected 6 lessons, "
                  f"got {len(all_lessons)}."
              )

          model_counts = {}

          for lesson in all_lessons:
              model = lesson.get(
                  "_model_used",
                  "unknown",
              )

              model_counts[model] = (
                  model_counts.get(model, 0) + 1
              )

          result = {
              "total_lessons": len(all_lessons),
              "pairs": 3,
              "model_counts": model_counts,
              "lessons": all_lessons,
          }

          Path(
              "gemini_three_pair_result.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print("")
          print("========================================")
          print("3-PAIR / 6-LESSON TEST PASSED")
          print("========================================")
          print(
              f"Total lessons: {len(all_lessons)}"
          )

          print(
              f"Model usage: {model_counts}"
          )
          PY

      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: orom-plan1-gemini-three-pair-result
          path: gemini_three_pair_result.json

      - name: Final result
        run: |
          echo "Orom Plan1 3-pair / 6-lesson test completed successfully."
