name: Orom Plan1 - Gemini 5 Pair Test

on:
  workflow_dispatch:

jobs:
  gemini-5-pair-test:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Check required files
        run: |
          test -f content_planner.py
          test -f content_batch_generator.py
          echo "Required files found."

      - name: Check Python syntax
        run: |
          python -m py_compile content_planner.py
          python -m py_compile content_batch_generator.py
          echo "Python syntax check passed."

      - name: Run 5-pair / 10-lesson Gemini test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from content_planner import (
              create_daily_plan,
              validate_daily_plan,
          )

          from content_batch_generator import (
              generate_content_batches,
              MODEL_NAME,
              FALLBACK_MODEL_NAME,
          )

          print("")
          print("=" * 56)
          print("OROM PLAN1")
          print("GEMINI 5-PAIR / 10-LESSON TEST")
          print("=" * 56)

          # --------------------------------------------------
          # CREATE DAILY PLAN
          # --------------------------------------------------

          history_file = Path(
              "gemini_5_pair_test_history.json"
          )

          plan = create_daily_plan(
              day_number=1,
              history_file=history_file,
          )

          print("")
          print(
              f"Daily plan created: {len(plan)} items"
          )

          if not validate_daily_plan(plan):
              raise RuntimeError(
                  "Daily plan validation failed."
              )

          print(
              "Daily plan validation: PASSED"
          )

          # --------------------------------------------------
          # GENERATE 10 LESSONS
          # --------------------------------------------------

          print("")
          print("=" * 56)
          print("STARTING 5 GEMINI PAIR REQUESTS")
          print("=" * 56)

          content = generate_content_batches(
              plan
          )

          # --------------------------------------------------
          # FINAL VALIDATION
          # --------------------------------------------------

          print("")
          print("=" * 56)
          print("FINAL VALIDATION")
          print("=" * 56)

          if len(content) != 10:
              raise RuntimeError(
                  f"Expected 10 lessons, got {len(content)}"
              )

          reels = [
              item
              for item in content
              if item.get("content_type") == "reel"
          ]

          visuals = [
              item
              for item in content
              if item.get("content_type")
              == "educational_visual"
          ]

          if len(reels) != 5:
              raise RuntimeError(
                  f"Expected 5 reels, got {len(reels)}"
              )

          if len(visuals) != 5:
              raise RuntimeError(
                  "Expected 5 educational visuals, "
                  f"got {len(visuals)}"
              )

          required_fields = [
              "title",
              "description",
              "image_prompt",
              "hashtags",
              "visual_story",
              "on_image_text",
              "lesson_type",
              "content_type",
              "knowledge_area",
              "lesson_number",
          ]

          for index, item in enumerate(
              content,
              start=1,
          ):
              for field in required_fields:
                  if field not in item:
                      raise RuntimeError(
                          f"Post {index} is missing "
                          f"required field: {field}"
                      )

          # --------------------------------------------------
          # MODEL USAGE REPORT
          # --------------------------------------------------

          model_usage = {}

          for item in content:
              model = item.get(
                  "_model_used",
                  "unknown",
              )

              model_usage[model] = (
                  model_usage.get(model, 0) + 1
              )

          print("")
          print("=" * 56)
          print("MODEL USAGE")
          print("=" * 56)

          for model, count in model_usage.items():
              print(
                  f"{model}: {count} lessons"
              )

          # --------------------------------------------------
          # SAVE TEST RESULT
          # --------------------------------------------------

          result = {
              "status": "PASSED",
              "total_lessons": len(content),
              "reels": len(reels),
              "educational_visuals": len(visuals),
              "primary_model": MODEL_NAME,
              "fallback_model": FALLBACK_MODEL_NAME,
              "model_usage": model_usage,
              "lessons": content,
          }

          output_file = Path(
              "gemini_5_pair_test_result.json"
          )

          output_file.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print("")
          print("=" * 56)
          print("5-PAIR / 10-LESSON TEST PASSED")
          print("=" * 56)
          print(
              f"Total lessons: {len(content)}"
          )
          print(
              f"Reels: {len(reels)}"
          )
          print(
              f"Educational visuals: {len(visuals)}"
          )
          print(
              f"Primary model: {MODEL_NAME}"
          )
          print(
              f"Fallback model: {FALLBACK_MODEL_NAME}"
          )
          print("=" * 56)
          PY

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-5-pair-test-result
          path: gemini_5_pair_test_result.json
          if-no-files-found: ignore
