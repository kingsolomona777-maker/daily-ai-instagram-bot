name: Run Daily AI Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Gemini SDK
        run: pip install google-genai

      - name: Install image dependencies
        run: pip install requests Pillow


      - name: Run Python bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python main.py

      - name: Test Instagram connection
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["INSTAGRAM_ACCESS_TOKEN"]

          response = requests.get(
              "https://graph.instagram.com/me",
              params={
                  "fields": "id,username",
                  "access_token": token
              },
              timeout=30
          )

          print("Instagram API response:")
          print(response.text)

          response.raise_for_status()
          PY

      - name: Save image to public repository
        run: |
          mkdir -p daily_images
          cp instagram_image.jpg daily_images/$(date +%Y-%m-%d).jpg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily_images/
          git diff --cached --quiet || git commit -m "Add daily Instagram image"
          git push
          
      - name: Save bot memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_history.json
          git diff --cached --quiet || git commit -m "Update content history"
          git push
