name: Run Daily AI Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Gemini SDK
        run: pip install google-genai

      - name: Install image dependencies
        run: pip install requests

      - name: Test Cloudflare image generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -c "from image_generator import generate_image; generate_image('A realistic professional plumber inspecting a clean modern bathroom water pipe system, professional photography, natural lighting, no text, no logos')"

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-test-image
          path: daily_image.png

      - name: Run Python bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save bot memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_history.json
          git diff --cached --quiet || git commit -m "Update content history"
          git push
