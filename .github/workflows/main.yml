name: Run Daily AI Bot

on:
  schedule:
    # 6:30 AM Nigeria time (WAT / UTC+1)
    - cron: '30 5 * * *'

    # 1:30 PM Nigeria time
    - cron: '30 12 * * *'

    # 8:30 PM Nigeria time
    - cron: '30 19 * * *'

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # GET PROJECT CODE
      # ==========================================
      - name: Get the code
        uses: actions/checkout@v5

      # ==========================================
      # SET UP PYTHON
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          pip install google-genai requests Pillow

      # ==========================================
      # RUN AI CONTENT + IMAGE GENERATION
      # ==========================================
      - name: Run Python bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python main.py

      # ==========================================
      # TEST INSTAGRAM CONNECTION
      # ==========================================
      - name: Test Instagram connection
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["INSTAGRAM_ACCESS_TOKEN"]

          response = requests.get(
              "https://graph.instagram.com/v26.0/me",
              params={
                  "fields": "id,username",
                  "access_token": token
              },
              timeout=30
          )

          print("Instagram API response:")
          print(response.text)

          response.raise_for_status()

          print("✅ Instagram connection successful.")
          PY

      # ==========================================
      # SAVE IMAGE + CONTENT TO GITHUB
      # ==========================================
      - name: Save image and content to public repository
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TIME=$(date -u +%H-%M-%S)

          mkdir -p daily_images

          IMAGE_FILE="daily_images/${DATE}_${TIME}.jpg"

          cp instagram_image.jpg "$IMAGE_FILE"

          echo "IMAGE_FILE=${IMAGE_FILE}" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily_images/ content_history.json latest_content.json

          git diff --cached --quiet || git commit -m "Add daily Instagram content"

          git push

          echo "✅ Image saved:"
          echo "$IMAGE_FILE"

      # ==========================================
      # WAIT FOR PUBLIC GITHUB IMAGE
      # ==========================================
      - name: Wait for public GitHub image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE_URL="https://raw.githubusercontent.com/${REPOSITORY}/main/${IMAGE_FILE}"

          echo "Checking public image:"
          echo "$IMAGE_URL"

          for attempt in {1..12}; do

            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")

            if [ "$STATUS" = "200" ]; then
              echo "✅ Public image is available."
              echo "IMAGE_URL=${IMAGE_URL}" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Image not available yet."
            echo "Attempt $attempt/12..."

            sleep 10
          done

          echo "❌ GitHub image could not be reached."
          exit 1

      # ==========================================
      # CREATE INSTAGRAM MEDIA CONTAINER
      # ==========================================
      - name: Create Instagram media container
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          TOKEN = os.environ["INSTAGRAM_ACCESS_TOKEN"]
          IMAGE_URL = os.environ["IMAGE_URL"]

          BASE_URL = "https://graph.instagram.com/v26.0"

          # ------------------------------------------
          # GET INSTAGRAM ACCOUNT
          # ------------------------------------------

          me = requests.get(
              f"{BASE_URL}/me",
              params={
                  "fields": "id,username",
                  "access_token": TOKEN
              },
              timeout=30
          )

          print("Instagram account response:")
          print(me.text)

          me.raise_for_status()

          account = me.json()

          IG_USER_ID = account["id"]
          USERNAME = account.get("username", "")

          print(f"Instagram account: @{USERNAME}")
          print(f"Instagram ID: {IG_USER_ID}")

          # ------------------------------------------
          # LOAD GENERATED CONTENT
          # ------------------------------------------

          with open("latest_content.json", "r") as file:
              content = json.load(file)

          title = content["title"].strip()
          description = content["description"].strip()

          # ------------------------------------------
          # HASHTAGS
          # ------------------------------------------

          hashtags = (
              "#PlumbingTips "
              "#Plumbing "
              "#Plumber "
              "#HomeMaintenance "
              "#Homeowners "
              "#BathroomTips "
              "#Drainage "
              "#WaterLeaks "
              "#PlumbingMaintenance "
              "#DIYHome "
              "#HomeImprovement "
              "#PlumbingLife"
          )

          caption = (
              f"{title}\n\n"
              f"{description}\n\n"
              f"{hashtags}"
          )

          # Instagram caption safety limit
          caption = caption[:2200]

          print()
          print("Create Instagram media container")
          print(f"Image URL: {IMAGE_URL}")
          print()
          print("Caption:")
          print(caption)

          # ------------------------------------------
          # CREATE MEDIA CONTAINER
          # ------------------------------------------

          response = requests.post(
              f"{BASE_URL}/{IG_USER_ID}/media",
              data={
                  "image_url": IMAGE_URL,
                  "caption": caption,
                  "access_token": TOKEN
              },
              timeout=60
          )

          print()
          print("Instagram response:")
          print(response.text)

          response.raise_for_status()

          creation_id = response.json()["id"]

          print()
          print("✅ Instagram media container created.")
          print(f"Container ID: {creation_id}")

          # ------------------------------------------
          # SAVE CONTAINER INFORMATION
          # ------------------------------------------

          with open("instagram_container.json", "w") as file:
              json.dump(
                  {
                      "creation_id": creation_id,
                      "instagram_user_id": IG_USER_ID,
                      "username": USERNAME
                  },
                  file,
                  indent=2
              )

          PY

      # ==========================================
      # WAIT FOR INSTAGRAM IMAGE PROCESSING
      # ==========================================
      - name: Wait for Instagram image processing
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import requests

          TOKEN = os.environ["INSTAGRAM_ACCESS_TOKEN"]

          BASE_URL = "https://graph.instagram.com/v26.0"

          with open("instagram_container.json", "r") as file:
              data = json.load(file)

          creation_id = data["creation_id"]

          print("Waiting for Instagram image to finish processing...")

          for attempt in range(1, 31):

              response = requests.get(
                  f"{BASE_URL}/{creation_id}",
                  params={
                      "fields": "status_code,status",
                      "access_token": TOKEN
                  },
                  timeout=30
              )

              print()
              print(f"Processing check {attempt}/30:")
              print(response.text)

              response.raise_for_status()

              status = response.json().get("status_code")

              if status == "FINISHED":
                  print("✅ Instagram image is ready.")
                  break

              if status in ("ERROR", "EXPIRED"):
                  raise RuntimeError(
                      f"Instagram processing failed: {response.text}"
                  )

              time.sleep(10)

          else:
              raise RuntimeError(
                  "Instagram image did not finish processing in time."
              )

          PY

      # ==========================================
      # PUBLISH INSTAGRAM POST
      # ==========================================
      - name: Publish Instagram post
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          TOKEN = os.environ["INSTAGRAM_ACCESS_TOKEN"]

          BASE_URL = "https://graph.instagram.com/v26.0"

          with open("instagram_container.json", "r") as file:
              data = json.load(file)

          ig_user_id = data["instagram_user_id"]
          creation_id = data["creation_id"]
          username = data["username"]

          print("Publishing Instagram post...")

          response = requests.post(
              f"{BASE_URL}/{ig_user_id}/media_publish",
              data={
                  "creation_id": creation_id,
                  "access_token": TOKEN
              },
              timeout=60
          )

          print()
          print("Instagram publish response:")
          print(response.text)

          response.raise_for_status()

          media_id = response.json()["id"]

          print()
          print("==========================================")
          print("🎉 INSTAGRAM POST PUBLISHED SUCCESSFULLY!")
          print("==========================================")
          print(f"Instagram account: @{username}")
          print(f"Instagram media ID: {media_id}")
          print("==========================================")

          PY

      # ==========================================
      # SAVE BOT MEMORY
      # ==========================================
      - name: Save bot memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content_history.json

          git diff --cached --quiet || git commit -m "Update content history"

          git push

          echo "✅ Bot memory saved."
