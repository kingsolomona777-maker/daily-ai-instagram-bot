name: Orom Plan1 - Real Instagram Reel Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-instagram-reel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check required files
        run: |
          test -f content_planner.py
          test -f content_batch_generator.py
          test -f daily_content_engine.py
          test -f image_generator.py
          test -f reel_generator.py
          echo "All required files found."

      - name: Check Python syntax
        run: |
          python -m py_compile content_planner.py
          python -m py_compile content_batch_generator.py
          python -m py_compile daily_content_engine.py
          python -m py_compile image_generator.py
          python -m py_compile reel_generator.py
          echo "Python syntax check passed."

      - name: Create temporary test audio
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=440:duration=8" \
            -ar 48000 \
            -ac 2 \
            -c:a pcm_s16le \
            test_instagram_reel_audio.wav

          test -s test_instagram_reel_audio.wav
          echo "Test audio created."

      - name: Generate 10 real lessons
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          from content_planner import create_daily_plan, validate_daily_plan
          from content_batch_generator import generate_content_batches

          print("=" * 70)
          print("OROM PLAN1 - REAL INSTAGRAM REEL TEST")
          print("=" * 70)

          history_file = Path("instagram_reel_test_history.json")

          daily_plan = create_daily_plan(
              day_number=1,
              history_file=history_file,
          )

          if not validate_daily_plan(daily_plan):
              raise RuntimeError("Daily plan validation failed.")

          if len(daily_plan) != 10:
              raise RuntimeError(
                  f"Expected 10 plan items, got {len(daily_plan)}"
              )

          print(f"Daily plan: {len(daily_plan)} posts")

          content = generate_content_batches(daily_plan)

          if len(content) != 10:
              raise RuntimeError(
                  f"Expected 10 generated lessons, got {len(content)}"
              )

          reels = [
              item for item in content
              if item.get("content_type") == "reel"
          ]

          visuals = [
              item for item in content
              if item.get("content_type") == "educational_visual"
          ]

          if len(reels) != 5:
              raise RuntimeError(
                  f"Expected 5 Reels, got {len(reels)}"
              )

          if len(visuals) != 5:
              raise RuntimeError(
                  f"Expected 5 educational visuals, got {len(visuals)}"
              )

          selected_index = next(
              index
              for index, item in enumerate(content)
              if item.get("content_type") == "reel"
          )

          selected = content[selected_index]

          print()
          print("Generated 10 lessons successfully.")
          print("Reels:", len(reels))
          print("Educational visuals:", len(visuals))
          print()
          print("Selected Reel:")
          print("Index:", selected_index)
          print("Title:", selected.get("title"))
          print("Lesson type:", selected.get("lesson_type"))
          print("Knowledge area:", selected.get("knowledge_area"))

          with open(
              "instagram_reel_test_content.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  {
                      "daily_plan": daily_plan,
                      "content": content,
                      "selected_index": selected_index,
                  },
                  f,
                  indent=2,
                  ensure_ascii=False,
              )

          print()
          print("Content generation passed.")
          PY

      - name: Generate real media
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          from daily_content_engine import generate_daily_content

          with open(
              "instagram_reel_test_content.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          daily_plan = data["daily_plan"]
          content = data["content"]
          selected_index = data["selected_index"]

          output_directory = Path(
              "instagram_reel_test_output"
          )

          output_directory.mkdir(
              parents=True,
              exist_ok=True,
          )

          packages = generate_daily_content(
              daily_plan=daily_plan,
              output_directory=output_directory,
              generated_content=content,
              audio_file=Path(
                  "test_instagram_reel_audio.wav"
              ),
          )

          if len(packages) != 10:
              raise RuntimeError(
                  f"Expected 10 media packages, got {len(packages)}"
              )

          selected_package = packages[selected_index]

          if selected_package.get("content_type") != "reel":
              raise RuntimeError(
                  "Selected package is not a Reel."
              )

          reel_file = Path(
              selected_package["reel_file"]
          )

          if not reel_file.exists():
              raise RuntimeError(
                  f"Reel file does not exist: {reel_file}"
              )

          if reel_file.stat().st_size <= 0:
              raise RuntimeError(
                  f"Reel file is empty: {reel_file}"
              )

          print()
          print("Real media generation passed.")
          print("Selected Reel:", reel_file)
          print("Reel size:", reel_file.stat().st_size)

          with open(
              "selected_reel_metadata.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  {
                      "reel_file": str(reel_file),
                      "title": selected_package.get("title"),
                      "description": selected_package.get(
                          "description"
                      ),
                      "content_type": selected_package.get(
                          "content_type"
                      ),
                      "reel_audio_file": selected_package.get(
                          "reel_audio_file"
                      ),
                  },
                  f,
                  indent=2,
                  ensure_ascii=False,
              )
          PY

      - name: Validate Reel video and audio
        run: |
          set -e

          REEL_FILE=$(python - <<'PY'
          import json

          with open(
              "selected_reel_metadata.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(data["reel_file"])
          PY
          )

          VIDEO_CODEC=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$REEL_FILE")

          AUDIO_CODEC=$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of csv=p=0 \
            "$REEL_FILE")

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$REEL_FILE")

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$REEL_FILE")

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$REEL_FILE")

          echo "Video codec: $VIDEO_CODEC"
          echo "Audio codec: $AUDIO_CODEC"
          echo "Width: $WIDTH"
          echo "Height: $HEIGHT"
          echo "Duration: $DURATION"

          test "$VIDEO_CODEC" = "h264"
          test "$AUDIO_CODEC" = "aac"

          echo "Reel video/audio validation passed."

      - name: Prepare public Reel
        id: prepare_url
        run: |
          set -e

          REEL_FILE=$(python - <<'PY'
          import json

          with open(
              "selected_reel_metadata.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(data["reel_file"])
          PY
          )

          PUBLIC_DIR="instagram_reel_test_public"
          PUBLIC_FILE="$PUBLIC_DIR/orom-plan1-instagram-reel-test.mp4"

          rm -rf "$PUBLIC_DIR"
          mkdir -p "$PUBLIC_DIR"

          cp "$REEL_FILE" "$PUBLIC_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PUBLIC_FILE"

          git diff --cached --quiet || \
            git commit -m "test: update temporary Orom Plan1 Instagram Reel"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          PUBLIC_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${PUBLIC_FILE}"

          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Public Reel URL:"
          echo "$PUBLIC_URL"

      - name: Wait for public Reel
        env:
          PUBLIC_URL: ${{ steps.prepare_url.outputs.PUBLIC_URL }}
        run: |
          set -e

          for attempt in $(seq 1 12); do
            echo "Checking public Reel: attempt $attempt/12"

            HTTP_CODE=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              "$PUBLIC_URL")

            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Public Reel is reachable."
              exit 0
            fi

            sleep 5
          done

          echo "Public Reel did not become reachable."
          exit 1

      - name: Verify Instagram Login token
        id: instagram_user
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set -e

          RESPONSE=$(curl \
            -sS \
            --get \
            "https://graph.instagram.com/v26.0/me" \
            --data-urlencode "fields=id,username" \
            --data-urlencode "access_token=$INSTAGRAM_ACCESS_TOKEN")

          echo "Instagram account response:"
          echo "$RESPONSE"

          echo "$RESPONSE" > instagram_user_response.json

          python - <<'PY'
          import json

          with open(
              "instagram_user_response.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          if "error" in data:
              raise SystemExit(
                  "Instagram token error:\n"
                  + json.dumps(
                      data["error"],
                      indent=2,
                  )
              )

          user_id = data.get("id")
          username = data.get("username")

          if not user_id:
              raise SystemExit(
                  "Instagram API did not return user ID."
              )

          print()
          print("Instagram username:", username)
          print("Instagram user ID:", user_id)

          with open(
              "instagram_user.env",
              "w",
          ) as f:
              f.write(f"IG_USER_ID={user_id}\n")
              f.write(f"USERNAME={username}\n")
          PY

          cat instagram_user.env >> "$GITHUB_OUTPUT"

      - name: Load Instagram account
        id: load_user
        run: |
          cat instagram_user.env

          source instagram_user.env

          echo "IG_USER_ID=$IG_USER_ID" >> "$GITHUB_OUTPUT"
          echo "USERNAME=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Create Instagram Reel container
        id: create_container
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: ${{ steps.load_user.outputs.IG_USER_ID }}
          PUBLIC_URL: ${{ steps.prepare_url.outputs.PUBLIC_URL }}
        run: |
          set -e

          CAPTION="Orom Plan1 Reel Test ${GITHUB_RUN_NUMBER}. Technical publishing test for our automated plumbing education system."

          echo "Creating Instagram Reel container..."

          RESPONSE=$(curl \
            -sS \
            --request POST \
            "https://graph.instagram.com/v26.0/${IG_USER_ID}/media" \
            --data-urlencode "media_type=REELS" \
            --data-urlencode "video_url=${PUBLIC_URL}" \
            --data-urlencode "caption=${CAPTION}" \
            --data-urlencode "share_to_feed=true" \
            --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}")

          echo "Instagram container response:"
          echo "$RESPONSE"

          echo "$RESPONSE" > instagram_container_response.json

          CONTAINER_ID=$(python - <<'PY'
          import json

          with open(
              "instagram_container_response.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          if "error" in data:
              raise SystemExit(
                  "Instagram container creation failed:\n"
                  + json.dumps(
                      data["error"],
                      indent=2,
                  )
              )

          container_id = data.get("id")

          if not container_id:
              raise SystemExit(
                  "Instagram API did not return container ID."
              )

          print(container_id)
          PY
          )

          echo "CONTAINER_ID=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

          echo "Instagram Reel container created:"
          echo "$CONTAINER_ID"

      - name: Wait for Reel processing
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CONTAINER_ID: ${{ steps.create_container.outputs.CONTAINER_ID }}
        run: |
          set -e

          echo "Waiting for Instagram to process the Reel..."

          for attempt in $(seq 1 20); do

            echo ""
            echo "Status check $attempt/20"

            RESPONSE=$(curl \
              -sS \
              --get \
              "https://graph.instagram.com/v26.0/${CONTAINER_ID}" \
              --data-urlencode "fields=status_code,status" \
              --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}")

            echo "$RESPONSE"

            echo "$RESPONSE" > instagram_container_status.json

            STATUS=$(python - <<'PY'
            import json

            with open(
                "instagram_container_status.json",
                "r",
                encoding="utf-8",
            ) as f:
                data = json.load(f)

            if "error" in data:
                raise SystemExit(
                    "Instagram status request failed:\n"
                    + json.dumps(
                        data["error"],
                        indent=2,
                    )
                )

            print(data.get("status_code", "UNKNOWN"))
            PY
            )

            echo "Current status: $STATUS"

            if [ "$STATUS" = "FINISHED" ]; then
              echo "Instagram Reel is ready."
              exit 0
            fi

            if [ "$STATUS" = "ERROR" ] || \
               [ "$STATUS" = "EXPIRED" ]; then
              echo "Instagram Reel processing failed."
              cat instagram_container_status.json
              exit 1
            fi

            sleep 15
          done

          echo "Instagram Reel did not reach FINISHED."
          exit 1

      - name: Publish Instagram Reel
        id: publish
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: ${{ steps.load_user.outputs.IG_USER_ID }}
          CONTAINER_ID: ${{ steps.create_container.outputs.CONTAINER_ID }}
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "PUBLISHING REAL INSTAGRAM REEL"
          echo "============================================================"

          RESPONSE=$(curl \
            -sS \
            --request POST \
            "https://graph.instagram.com/v26.0/${IG_USER_ID}/media_publish" \
            --data-urlencode "creation_id=${CONTAINER_ID}" \
            --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}")

          echo "Instagram publish response:"
          echo "$RESPONSE"

          echo "$RESPONSE" > instagram_publish_response.json

          MEDIA_ID=$(python - <<'PY'
          import json

          with open(
              "instagram_publish_response.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          if "error" in data:
              raise SystemExit(
                  "Instagram Reel publishing failed:\n"
                  + json.dumps(
                      data["error"],
                      indent=2,
                  )
              )

          media_id = data.get("id")

          if not media_id:
              raise SystemExit(
                  "Instagram API did not return published media ID."
              )

          print(media_id)
          PY
          )

          echo "MEDIA_ID=$MEDIA_ID" >> "$GITHUB_OUTPUT"

          echo ""
          echo "============================================================"
          echo "REAL INSTAGRAM REEL PUBLISHED"
          echo "============================================================"
          echo "Instagram Media ID: $MEDIA_ID"
          echo "============================================================"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orom-plan1-real-instagram-reel-test
          path: |
            instagram_reel_test_output/
            instagram_reel_test_content.json
            selected_reel_metadata.json
            instagram_user_response.json
            instagram_container_response.json
            instagram_container_status.json
            instagram_publish_response.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Final success summary
        if: success()
        env:
          IG_USERNAME: ${{ steps.load_user.outputs.USERNAME }}
          IG_USER_ID: ${{ steps.load_user.outputs.IG_USER_ID }}
          CONTAINER_ID: ${{ steps.create_container.outputs.CONTAINER_ID }}
          MEDIA_ID: ${{ steps.publish.outputs.MEDIA_ID }}
        run: |
          echo ""
          echo "============================================================"
          echo "OROM PLAN1 REAL INSTAGRAM REEL TEST PASSED"
          echo "============================================================"
          echo ""
          echo "Instagram username: @$IG_USERNAME"
          echo "Instagram user ID: $IG_USER_ID"
          echo "Container ID: $CONTAINER_ID"
          echo "Published Media ID: $MEDIA_ID"
          echo ""
          echo "Gemini: USED"
          echo "Cloudflare: USED"
          echo "Reel generation: PASSED"
          echo "Audio: PASSED"
          echo "Instagram Login token: PASSED"
          echo "Instagram container: PASSED"
          echo "Instagram processing: PASSED"
          echo "Instagram publishing: PASSED"
          echo ""
          echo "============================================================"
