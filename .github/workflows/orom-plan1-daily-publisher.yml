name: Orom Plan1 Daily Publisher

on:
  workflow_dispatch:

  schedule:
    # Runs approximately every 15 minutes.
    # Times are UTC. Lagos is UTC+1.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: orom-plan1-daily-publisher
  cancel-in-progress: false

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Publish all due posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests


          GRAPH_VERSION = "v26.0"
          GRAPH_BASE = f"https://graph.instagram.com/{GRAPH_VERSION}"
          TIMEZONE = ZoneInfo("Africa/Lagos")

          token = os.environ["INSTAGRAM_ACCESS_TOKEN"]

          print("==============================================")
          print("OROM PLAN1 DAILY PUBLISHER")
          print("==============================================")

          now = datetime.now(TIMEZONE)
          package_date = now.strftime("%Y-%m-%d")
          package_dir = Path("daily_packages") / package_date
          schedule_file = package_dir / "schedule.json"

          print(f"Lagos date: {package_date}")
          print(f"Lagos time: {now.strftime('%H:%M:%S')}")
          print(f"Package: {package_dir}")
          print("==============================================")


          # ============================================================
          # 1. Require today's package
          # ============================================================

          if not schedule_file.exists():
              print("No package exists for today yet.")
              print("Nothing will be published.")
              raise SystemExit(0)

          with schedule_file.open("r", encoding="utf-8") as f:
              schedule_data = json.load(f)

          package_status = schedule_data.get("status")

          print(f"Package status: {package_status}")

          if package_status != "ready":
              raise SystemExit(
                  "ERROR: Today's package is not READY. "
                  "Publisher will not publish anything."
              )


          # ============================================================
          # 2. Validate package structure
          # ============================================================

          total_posts = schedule_data.get("total_posts")
          reels = schedule_data.get("reels")
          visuals = schedule_data.get("educational_visuals")

          if total_posts != 10:
              raise SystemExit(
                  f"ERROR: Package must contain exactly 10 posts. "
                  f"Found: {total_posts}"
              )

          if reels != 5:
              raise SystemExit(
                  f"ERROR: Package must contain exactly 5 Reels. "
                  f"Found: {reels}"
              )

          if visuals != 5:
              raise SystemExit(
                  f"ERROR: Package must contain exactly 5 educational "
                  f"visuals. Found: {visuals}"
              )

          schedule_entries = schedule_data.get("schedule")

          if not isinstance(schedule_entries, list):
              raise SystemExit(
                  "ERROR: schedule.json does not contain a valid schedule."
              )

          if len(schedule_entries) != 10:
              raise SystemExit(
                  "ERROR: Schedule must contain exactly 10 entries."
              )


          # ============================================================
          # 3. Read all post metadata
          # ============================================================

          posts = []

          for index in range(1, 11):
              post_dir = package_dir / f"post_{index:02d}"
              content_file = post_dir / "content.json"

              if not content_file.exists():
                  raise SystemExit(
                      f"ERROR: Missing metadata: {content_file}"
                  )

              with content_file.open("r", encoding="utf-8") as f:
                  content = json.load(f)

              posts.append(
                  {
                      "index": index,
                      "directory": post_dir,
                      "content_file": content_file,
                      "content": content,
                  }
              )


          # ============================================================
          # 4. Parse schedule times
          # ============================================================

          def parse_schedule_time(value):
              if not isinstance(value, str):
                  return None

              try:
                  hour, minute = value.strip().split(":")
                  hour = int(hour)
                  minute = int(minute)

                  if not (0 <= hour <= 23):
                      return None

                  if not (0 <= minute <= 59):
                      return None

                  return hour, minute

              except Exception:
                  return None


          # ============================================================
          # 5. Find EVERY pending post that is already due
          #
          # This is the major fix.
          #
          # If GitHub runs late, all overdue posts are collected.
          # Future posts are never published early.
          # ============================================================

          candidates = []

          for entry in schedule_entries:
              slot = entry.get("slot")
              schedule_time = entry.get("schedule_time")

              if slot is None:
                  raise SystemExit(
                      "ERROR: Schedule entry is missing slot."
                  )

              try:
                  slot_number = int(slot)
              except Exception:
                  raise SystemExit(
                      f"ERROR: Invalid schedule slot: {slot}"
                  )

              if not 1 <= slot_number <= 10:
                  raise SystemExit(
                      f"ERROR: Invalid schedule slot number: {slot_number}"
                  )

              parsed = parse_schedule_time(schedule_time)

              if parsed is None:
                  raise SystemExit(
                      f"ERROR: Invalid schedule time for post "
                      f"{slot_number}: {schedule_time}"
                  )

              hour, minute = parsed

              scheduled_datetime = now.replace(
                  hour=hour,
                  minute=minute,
                  second=0,
                  microsecond=0,
              )

              post = posts[slot_number - 1]
              content = post["content"]

              publication_status = content.get(
                  "publication_status",
                  "pending",
              )

              if publication_status == "published":
                  continue

              if publication_status != "pending":
                  raise SystemExit(
                      f"ERROR: post_{slot_number:02d} has unexpected "
                      f"publication_status: {publication_status}"
                  )

              # Only posts whose scheduled Lagos time has arrived
              # are eligible.
              if now >= scheduled_datetime:
                  candidates.append(
                      (
                          scheduled_datetime,
                          slot_number,
                          schedule_time,
                          post,
                      )
                  )


          # ============================================================
          # 6. Nothing due
          # ============================================================

          if not candidates:
              print("")
              print("No pending post is due yet.")
              print("Publisher finished without publishing anything.")
              raise SystemExit(0)


          # ============================================================
          # 7. Publish oldest due posts first
          # ============================================================

          candidates.sort(
              key=lambda item: (
                  item[0],
                  item[1],
              )
          )

          print("")
          print("Due posts found:")
          print("----------------------------------------------")

          for item in candidates:
              _, slot_number, schedule_time, post = item
              content = post["content"]

              print(
                  f"post_{slot_number:02d} | "
                  f"scheduled {schedule_time} | "
                  f"{content.get('content_type')} | "
                  f"{content.get('publication_status')}"
              )

          print("----------------------------------------------")
          print(f"Total due posts: {len(candidates)}")


          # ============================================================
          # 8. Helper to save publication status
          # ============================================================

          def save_publication_status(
              content_file,
              content,
              slot_number,
              media_id,
          ):
              content["publication_status"] = "published"
              content["instagram_media_id"] = media_id
              content["published_at"] = datetime.now(
                  TIMEZONE
              ).isoformat()

              with content_file.open(
                  "w",
                  encoding="utf-8",
              ) as f:
                  json.dump(
                      content,
                      f,
                      indent=2,
                      ensure_ascii=False,
                  )
                  f.write("\n")

              print(
                  f"Updated: {content_file}"
              )

              # Configure Git identity.
              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "github-actions[bot]",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ],
                  check=True,
              )

              # Stage only this exact post.
              subprocess.run(
                  [
                      "git",
                      "add",
                      str(content_file),
                  ],
                  check=True,
              )

              diff_check = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet",
                  ]
              )

              if diff_check.returncode == 0:
                  raise SystemExit(
                      "ERROR: No metadata change was detected."
                  )

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      f"Mark Orom Plan1 post_{slot_number:02d} as published",
                  ],
                  check=True,
              )

              subprocess.run(
                  [
                      "git",
                      "push",
                  ],
                  check=True,
              )

              print(
                  f"GitHub status committed for post_{slot_number:02d}."
              )


          # ============================================================
          # 9. Publish each due post
          # ============================================================

          published_count = 0

          for (
              scheduled_datetime,
              slot_number,
              schedule_time,
              post,
          ) in candidates:

              post_dir = post["directory"]
              content_file = post["content_file"]
              content = post["content"]

              print("")
              print("==============================================")
              print(
                  f"PUBLISHING post_{slot_number:02d}"
              )
              print("==============================================")

              print(f"Scheduled time: {schedule_time}")
              print(
                  f"Content type: "
                  f"{content.get('content_type')}"
              )
              print(
                  f"Current status: "
                  f"{content.get('publication_status')}"
              )


              # ========================================================
              # 10. Safety checks
              # ========================================================

              content_type = content.get("content_type")

              if content_type not in {
                  "reel",
                  "educational_visual",
              }:
                  raise SystemExit(
                      f"ERROR: Unsupported content type: {content_type}"
                  )

              if content.get("publication_status") != "pending":
                  raise SystemExit(
                      "ERROR: Selected post is no longer pending."
                  )


              # ========================================================
              # 11. Build caption
              # ========================================================

              title = str(
                  content.get("title", "")
              ).strip()

              description = str(
                  content.get("description", "")
              ).strip()

              hashtags = content.get("hashtags", [])

              if isinstance(hashtags, list):
                  hashtag_text = " ".join(
                      str(tag).strip()
                      for tag in hashtags
                      if str(tag).strip()
                  )
              else:
                  hashtag_text = str(
                      hashtags
                  ).strip()

              caption = "\n\n".join(
                  part
                  for part in [
                      title,
                      description,
                      hashtag_text,
                  ]
                  if part
              )

              if not caption:
                  raise SystemExit(
                      "ERROR: Caption is empty."
                  )


              # ========================================================
              # 12. Verify required media
              # ========================================================

              image_file = post_dir / "image.jpg"
              reel_file = post_dir / "reel.mp4"

              if content_type == "reel":
                  if not reel_file.exists():
                      raise SystemExit(
                          f"ERROR: Missing Reel file: {reel_file}"
                      )

                  media_file = reel_file

              else:
                  if not image_file.exists():
                      raise SystemExit(
                          f"ERROR: Missing image file: {image_file}"
                      )

                  media_file = image_file

              print(f"Media file: {media_file}")


              # ========================================================
              # 13. Build public GitHub media URL
              # ========================================================

              repository = os.environ.get(
                  "GITHUB_REPOSITORY",
                  "kingsolomona777-maker/daily-ai-instagram-bot",
              )

              media_relative_path = (
                  f"daily_packages/{package_date}/"
                  f"post_{slot_number:02d}/"
                  f"{media_file.name}"
              )

              media_url = (
                  f"https://raw.githubusercontent.com/"
                  f"{repository}/main/{media_relative_path}"
              )

              print(
                  f"Public media URL: {media_url}"
              )


              # ========================================================
              # 14. Verify GitHub is serving the media
              # ========================================================

              media_check = requests.get(
                  media_url,
                  timeout=30,
                  allow_redirects=True,
              )

              print(
                  f"Media HTTP status: "
                  f"{media_check.status_code}"
              )

              print(
                  f"Media content type: "
                  f"{media_check.headers.get('content-type')}"
              )

              if media_check.status_code != 200:
                  raise SystemExit(
                      "ERROR: Public GitHub media URL is not available."
                  )


              # ========================================================
              # 15. Verify Instagram account/token
              # ========================================================

              me_response = requests.get(
                  f"{GRAPH_BASE}/me",
                  params={
                      "fields": "id,username",
                      "access_token": token,
                  },
                  timeout=30,
              )

              print(
                  f"Instagram account response: "
                  f"{me_response.text}"
              )

              me_response.raise_for_status()

              me_data = me_response.json()

              ig_user_id = me_data.get("id")
              username = me_data.get("username")

              if not ig_user_id:
                  raise SystemExit(
                      "ERROR: Instagram user ID was not returned."
                  )

              print(
                  f"Instagram account: @{username}"
              )

              print(
                  f"Instagram user ID: {ig_user_id}"
              )


              # ========================================================
              # 16. Create Instagram media container
              # ========================================================

              print("")
              print(
                  "Creating Instagram media container..."
              )

              if content_type == "reel":

                  create_response = requests.post(
                      f"{GRAPH_BASE}/{ig_user_id}/media",
                      data={
                          "media_type": "REELS",
                          "video_url": media_url,
                          "caption": caption,
                          "share_to_feed": "true",
                          "access_token": token,
                      },
                      timeout=60,
                  )

              else:

                  create_response = requests.post(
                      f"{GRAPH_BASE}/{ig_user_id}/media",
                      data={
                          "image_url": media_url,
                          "caption": caption,
                          "access_token": token,
                      },
                      timeout=60,
                  )

              print(
                  f"Container creation HTTP status: "
                  f"{create_response.status_code}"
              )

              print(
                  f"Container creation response: "
                  f"{create_response.text}"
              )

              create_response.raise_for_status()

              create_data = create_response.json()

              container_id = create_data.get("id")

              if not container_id:
                  raise SystemExit(
                      "ERROR: Instagram did not return a container ID."
                  )

              print(
                  f"Container ID: {container_id}"
              )


              # ========================================================
              # 17. Poll Instagram container
              # ========================================================

              print("")
              print(
                  "Waiting for Instagram container..."
              )

              finished = False

              for attempt in range(1, 21):

                  status_response = requests.get(
                      f"{GRAPH_BASE}/{container_id}",
                      params={
                          "fields": "status_code,status",
                          "access_token": token,
                      },
                      timeout=30,
                  )

                  print(
                      f"Poll {attempt}/20: "
                      f"{status_response.text}"
                  )

                  status_response.raise_for_status()

                  status_data = status_response.json()

                  status_code = status_data.get(
                      "status_code"
                  )

                  if status_code == "FINISHED":
                      finished = True

                      print(
                          "Instagram container is FINISHED."
                      )

                      break

                  if status_code in {
                      "ERROR",
                      "EXPIRED",
                  }:
                      raise SystemExit(
                          "ERROR: Instagram container failed: "
                          f"{status_response.text}"
                      )

                  time.sleep(15)


              if not finished:
                  raise SystemExit(
                      "ERROR: Instagram container did not reach "
                      "FINISHED within the allowed polling period."
                  )


              # ========================================================
              # 18. Publish to Instagram
              # ========================================================

              print("")
              print(
                  "Publishing post..."
              )

              publish_response = requests.post(
                  f"{GRAPH_BASE}/{ig_user_id}/media_publish",
                  data={
                      "creation_id": container_id,
                      "access_token": token,
                  },
                  timeout=60,
              )

              print(
                  f"Publish HTTP status: "
                  f"{publish_response.status_code}"
              )

              print(
                  f"Publish response: "
                  f"{publish_response.text}"
              )

              publish_response.raise_for_status()

              publish_data = publish_response.json()

              media_id = publish_data.get("id")

              if not media_id:
                  raise SystemExit(
                      "ERROR: Instagram did not return a media ID."
                  )

              print(
                  f"Instagram media ID: {media_id}"
              )


              # ========================================================
              # 19. Save status immediately
              #
              # IMPORTANT:
              # We commit after EACH successful post.
              #
              # If a later post fails, already published posts remain
              # permanently marked as published.
              # ========================================================

              save_publication_status(
                  content_file=content_file,
                  content=content,
                  slot_number=slot_number,
                  media_id=media_id,
              )

              published_count += 1

              print("")
              print(
                  f"SUCCESS: post_{slot_number:02d} published."
              )

              print(
                  f"Scheduled: {schedule_time}"
              )

              print(
                  f"Media ID: {media_id}"
              )

              print(
                  f"Published in this run: "
                  f"{published_count}"
              )


              # ========================================================
              # 20. Small safety pause before next overdue post
              #
              # This is only for catch-up situations.
              # Future posts are never published early.
              # ========================================================

              if published_count < len(candidates):
                  print("")
                  print(
                      "Catch-up mode: another post is already overdue."
                  )

                  print(
                      "Waiting 30 seconds before the next publication..."
                  )

                  time.sleep(30)


          # ============================================================
          # 21. Final result
          # ============================================================

          print("")
          print("==============================================")
          print("OROM PLAN1 DAILY PUBLISHER SUCCESS")
          print("==============================================")
          print(f"Account: @{username}")
          print(f"Date: {package_date}")
          print(
              f"Posts published this run: "
              f"{published_count}"
          )
          print(
              f"Due posts found at start: "
              f"{len(candidates)}"
          )
          print(
              "All successfully published posts were saved to GitHub."
          )
          print("==============================================")
          PY
