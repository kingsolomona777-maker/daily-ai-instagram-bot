          import json
          import sys
          import types
          from pathlib import Path
          from tempfile import TemporaryDirectory

          # ------------------------------------------------------------
          # Fake content generator
          # ------------------------------------------------------------
          fake_content_generator = types.ModuleType("content_generator")

          def fake_check_content(content):
              required = [
                  "title",
                  "description",
                  "image_prompt",
                  "hashtags",
                  "visual_story",
                  "on_image_text",
                  "lesson_type",
                  "content_type",
                  "knowledge_area",
                  "lesson_number",
              ]

              for field in required:
                  if field not in content:
                      raise RuntimeError(
                          f"Missing required field: {field}"
                      )

              return True

          fake_content_generator.check_content = fake_check_content
          fake_content_generator.MODEL_NAME = "fake-model"
          fake_content_generator.client = object()

          sys.modules["content_generator"] = fake_content_generator

          # ------------------------------------------------------------
          # Fake batch generator
          #
          # This keeps the engine test completely offline.
          # The real batch generator is tested separately above.
          # ------------------------------------------------------------
          fake_batch_generator = types.ModuleType(
              "content_batch_generator"
          )

          def fake_generate_content_pair(first_item, second_item):
              def make_content(plan_item, number):
                  content_type = plan_item["content_type"]

                  return {
                      "title": f"Test plumbing lesson {number}",
                      "description": (
                          f"Safe test description for lesson {number}."
                      ),
                      "image_prompt": (
                          "Professional realistic plumbing installation, "
                          "vertical 9:16 educational composition, "
                          "no text, no logo, no watermark."
                      ),
                      "hashtags": [
                          "#plumbing",
                          "#plumber",
                          "#plumbingtips",
                          "#homeimprovement",
                          "#plumbingeducation",
                      ],
                      "visual_story": (
                          f"Educational visual story for lesson {number}."
                      ),
                      "on_image_text": {
                          "hook": f"Plumbing lesson {number}",
                          "explanation": (
                              f"Important plumbing principle {number}."
                          ),
                          "callout": f"Professional tip {number}",
                          "takeaway": f"Remember lesson {number}.",
                      },
                      "lesson_type": plan_item["lesson_type"],
                      "content_type": content_type,
                      "knowledge_area": plan_item["knowledge_area"],
                      "lesson_number": plan_item["lesson_number"],
                  }

              return [
                  make_content(first_item, first_item["lesson_number"]),
                  make_content(second_item, second_item["lesson_number"]),
              ]

          def fake_attach_plan_metadata(
              generated_content,
              plan_items,
          ):
              for content, plan_item in zip(
                  generated_content,
                  plan_items,
              ):
                  content["lesson_type"] = plan_item["lesson_type"]
                  content["content_type"] = plan_item["content_type"]
                  content["knowledge_area"] = (
                      plan_item["knowledge_area"]
                  )
                  content["knowledge_path"] = (
                      plan_item["knowledge_path"]
                  )
                  content["lesson_number"] = (
                      plan_item["lesson_number"]
                  )
                  content["slot"] = plan_item["slot"]

              return generated_content

          fake_batch_generator.generate_content_pair = (
              fake_generate_content_pair
          )
          fake_batch_generator.attach_plan_metadata = (
              fake_attach_plan_metadata
          )

          sys.modules["content_batch_generator"] = fake_batch_generator

          # ------------------------------------------------------------
          # Fake image generator
          # ------------------------------------------------------------
          fake_image_generator = types.ModuleType("image_generator")

          def fake_generate_image(prompt, output_file):
              Path(output_file).write_bytes(b"fake-image")
              return output_file

          def fake_make_vertical_image(
              input_file,
              output_file,
              on_image_text=None,
          ):
              Path(output_file).write_bytes(b"fake-vertical-image")
              return output_file

          fake_image_generator.generate_image = fake_generate_image
          fake_image_generator.make_vertical_image = (
              fake_make_vertical_image
          )

          sys.modules["image_generator"] = fake_image_generator

          # ------------------------------------------------------------
          # Fake Reel generator
          # ------------------------------------------------------------
          fake_reel_generator = types.ModuleType("reel_generator")

          def fake_generate_reel(
              input_file,
              output_file,
              duration=8,
              teaching_text=None,
          ):
              Path(output_file).write_bytes(b"fake-reel")
              return output_file

          fake_reel_generator.generate_reel = fake_generate_reel

          sys.modules["reel_generator"] = fake_reel_generator

          # ------------------------------------------------------------
          # Import the REAL daily content engine.
          # ------------------------------------------------------------
          from daily_content_engine import (
              generate_daily_content,
              summarize_daily_content,
          )

          # ------------------------------------------------------------
          # Build a complete 10-post plan.
          # ------------------------------------------------------------
          daily_plan = []

          for slot in range(1, 11):
              if slot % 2 == 1:
                  content_type = "reel"
              else:
                  content_type = "educational_visual"

              daily_plan.append(
                  {
                      "slot": slot,
                      "content_type": content_type,
                      "role": "safe_test",
                      "lesson_type": "professional_tip",
                      "knowledge_path": "Professional Plumbing",
                      "knowledge_area": "General Plumbing",
                      "lesson_number": slot,
                      "previous_lesson": None,
                  }
              )

          # ------------------------------------------------------------
          # Run the REAL engine.
          # ------------------------------------------------------------
          with TemporaryDirectory() as temp_dir:
              output_directory = Path(temp_dir)

              package = generate_daily_content(
                  daily_plan=daily_plan,
                  output_directory=output_directory,
              )

              if len(package) != 10:
                  raise RuntimeError(
                      f"Expected 10 posts, got {len(package)}"
                  )

              reel_count = sum(
                  1
                  for item in package
                  if item["content"]["content_type"] == "reel"
