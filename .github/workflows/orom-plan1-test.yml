                          f"Missing image file: {image_file}"
                      )

                  if item["content"]["content_type"] == "reel":
                      reel_file = Path(item["reel_file"])

                      if not reel_file.exists():
                          raise RuntimeError(
                              f"Missing reel file: {reel_file}"
                          )

              summary = summarize_daily_content(package)

              if summary["total_posts"] != 10:
                  raise RuntimeError(
                      "Summary total_posts is not 10."
                  )

              if summary["reels"] != 5:
                  raise RuntimeError(
                      "Summary reels is not 5."
                  )

              if summary["educational_visuals"] != 5:
                  raise RuntimeError(
                      "Summary educational_visuals is not 5."
                  )

          print("Daily content engine safe test passed.")
          print("10 posts generated.")
          print("5 Reels verified.")
          print("5 educational visuals verified.")
          print("10 image files verified.")
          print("5 Reel files verified.")
          print("No real Gemini, image API, or Instagram publishing calls used.")
