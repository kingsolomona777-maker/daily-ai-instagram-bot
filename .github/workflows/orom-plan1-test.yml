name: Orom Plan1 Test

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai requests Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Check required project files
        run: |
          test -f main.py
          test -f content_generator.py
          test -f content_planner.py
          test -f daily_content_engine.py
          test -f content_batch_generator.py
          test -f image_generator.py
          test -f reel_generator.py
          test -f content_history.json
          test -f latest_content.json

          echo "Required Orom Plan1 files are present."

      - name: Check Python syntax
        run: |
          python -m py_compile \
            main.py \
            content_generator.py \
            content_planner.py \
            daily_content_engine.py \
            content_batch_generator.py \
            image_generator.py \
            reel_generator.py

          echo "Python syntax check passed."

      - name: Check JSON files
        run: |
          python -m json.tool content_history.json > /dev/null
          python -m json.tool latest_content.json > /dev/null

          echo "JSON validation passed."

      - name: Check project source files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              "main.py",
              "content_generator.py",
              "content_planner.py",
              "daily_content_engine.py",
              "content_batch_generator.py",
              "image_generator.py",
              "reel_generator.py",
          ]

          for filename in files:
              source = Path(filename).read_text(
                  encoding="utf-8"
              )

              ast.parse(
                  source,
                  filename=filename,
              )

              print(
                  f"Parsed successfully: {filename}"
              )

          print(
              "All project source files passed "
              "structural checks."
          )
          PY

      - name: Test 10-post content planner
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile

          from content_planner import (
              create_daily_plan,
              validate_daily_plan,
              print_daily_plan,
          )

          with tempfile.TemporaryDirectory() as temp_dir:
              history_file = (
                  Path(temp_dir)
                  / "content_history.json"
              )

              plan = create_daily_plan(
                  day_number=1,
                  history_file=history_file,
              )

              print_daily_plan(plan)

              if not validate_daily_plan(plan):
                  raise RuntimeError(
                      "10-post daily plan validation failed."
                  )

              reels = [
                  item
                  for item in plan
                  if item["content_type"] == "reel"
              ]

              visuals = [
                  item
                  for item in plan
                  if item["content_type"]
                  == "educational_visual"
              ]

              if len(plan) != 10:
                  raise RuntimeError(
                      f"Expected 10 posts, got {len(plan)}."
                  )

              if len(reels) != 5:
                  raise RuntimeError(
                      f"Expected 5 Reels, got {len(reels)}."
                  )

              if len(visuals) != 5:
                  raise RuntimeError(
                      f"Expected 5 visuals, got {len(visuals)}."
                  )

              print()
              print(
                  "=========================================="
              )
              print(
                  "10-POST PLANNER TEST PASSED"
              )
              print(
                  "=========================================="
              )
              print("Total posts: 10")
              print("Reels: 5")
              print("Educational visuals: 5")
              print(
                  "=========================================="
              )
          PY

      - name: Test planner rotation
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile

          from content_planner import (
              create_daily_plan,
          )

          with tempfile.TemporaryDirectory() as temp_dir:
              history_file = (
                  Path(temp_dir)
                  / "content_history.json"
              )

              plan_day_1 = create_daily_plan(
                  day_number=1,
                  history_file=history_file,
              )

              plan_day_2 = create_daily_plan(
                  day_number=2,
                  history_file=history_file,
              )

              path_1 = plan_day_1[0][
                  "knowledge_path"
              ]

              path_2 = plan_day_2[0][
                  "knowledge_path"
              ]

              print(
                  f"Day 1 knowledge path: {path_1}"
              )

              print(
                  f"Day 2 knowledge path: {path_2}"
              )

              if path_1 == path_2:
                  raise RuntimeError(
                      "Knowledge path did not rotate."
                  )

              print(
                  "Planner rotation passed."
              )
          PY

      - name: Test batch generator safely
        run: |
          python - <<'PY'
          import json
          import sys
          import types

          from pathlib import Path
          import tempfile

          # ------------------------------------------------
          # Replace content_generator with a fake module.
          #
          # This prevents ANY Gemini request.
          # ------------------------------------------------

          fake_content_generator = types.ModuleType(
              "content_generator"
          )

          class FakeClient:
              class Models:
                  def generate_content(
                      self,
                      model,
                      contents,
                  ):
                      raise RuntimeError(
                          "REAL GEMINI API WAS CALLED "
                          "DURING SAFE TEST."
                      )

              def __init__(self):
                  self.models = self.Models()

          fake_content_generator.MODEL_NAME = (
              "SAFE_TEST_MODEL"
          )

          fake_content_generator.client = (
              FakeClient()
          )

          sys.modules[
              "content_generator"
          ] = fake_content_generator

          from content_batch_generator import (
              validate_batch_content,
              attach_plan_metadata,
              build_pair_prompt,
          )

          # ------------------------------------------------
          # Create two realistic fake generated lessons.
          # ------------------------------------------------

          lesson_1 = {
              "title": (
                  "Why Drain Pipes Need Proper Slope"
              ),
              "description": (
                  "Learn why correct drainage slope "
                  "helps wastewater flow properly."
              ),
              "image_prompt": (
                  "Realistic plumbing drainage pipe "
                  "installation showing proper slope, "
                  "vertical 9:16 composition, no text."
              ),
              "hashtags": [
                  "#Plumbing",
                  "#Drainage",
                  "#PlumbingTips",
              ],
              "visual_story": (
                  "Show a drainage pipe installation "
                  "and clearly demonstrate the principle."
              ),
              "on_image_text": {
                  "hook": (
                      "Drainage needs more than a pipe."
                  ),
                  "explanation": (
                      "The pipe must allow wastewater "
                      "to move correctly."
                  ),
                  "callout": (
                      "Correct drainage slope"
                  ),
                  "takeaway": (
                      "Good drainage starts with good "
                      "installation principles."
                  ),
              },
          }

          lesson_2 = {
              "title": (
                  "How a Trap Helps Protect Your Home"
              ),
              "description": (
                  "Learn the purpose of a plumbing trap "
                  "and why it matters."
              ),
              "image_prompt": (
                  "Realistic plumbing trap beneath a "
                  "sink showing correct installation, "
                  "vertical 9:16 composition, no text."
              ),
              "hashtags": [
                  "#Plumbing",
                  "#BathroomPlumbing",
                  "#PlumbingEducation",
              ],
              "visual_story": (
                  "Show the trap beneath a sink and "
                  "explain its purpose."
              ),
              "on_image_text": {
                  "hook": (
                      "That bend under your sink matters."
                  ),
                  "explanation": (
                      "A properly installed trap plays "
                      "an important role in drainage."
                  ),
                  "callout": (
                      "Plumbing trap"
                  ),
                  "takeaway": (
                      "Know what each fitting is designed "
                      "to do."
                  ),
              },
          }

          batch = [
              lesson_1,
              lesson_2,
          ]

          if not validate_batch_content(
              batch,
              expected_count=2,
          ):
              raise RuntimeError(
                  "Two-lesson batch validation failed."
              )

          # ------------------------------------------------
          # Verify planner metadata attachment.
          # ------------------------------------------------

          plan_items = [
              {
                  "slot": 1,
                  "content_type": "reel",
                  "lesson_type": "problem_and_cause",
                  "knowledge_path": (
                      "Drainage Fundamentals"
                  ),
                  "knowledge_area": (
                      "Drainage pipe slope"
                  ),
                  "lesson_number": 1,
              },
              {
                  "slot": 2,
                  "content_type": (
                      "educational_visual"
                  ),
                  "lesson_type": "how_it_works",
                  "knowledge_path": (
                      "Drainage Fundamentals"
                  ),
                  "knowledge_area": (
                      "Plumbing traps"
                  ),
                  "lesson_number": 2,
              },
          ]

          attached = attach_plan_metadata(
              batch,
              plan_items,
          )

          if len(attached) != 2:
              raise RuntimeError(
                  "Metadata attachment failed."
              )

          if attached[0]["slot"] != 1:
              raise RuntimeError(
                  "First lesson slot is incorrect."
              )

          if attached[1]["slot"] != 2:
              raise RuntimeError(
                  "Second lesson slot is incorrect."
              )

          if attached[0]["lesson_number"] != 1:
              raise RuntimeError(
                  "First lesson number is incorrect."
              )

          if attached[1]["lesson_number"] != 2:
              raise RuntimeError(
                  "Second lesson number is incorrect."
              )

          # ------------------------------------------------
          # Verify the actual pair prompt.
          # ------------------------------------------------

          prompt = build_pair_prompt(
              plan_items[0],
              plan_items[1],
          )

          if "EXACTLY TWO" not in prompt:
              raise RuntimeError(
                  "Pair prompt is missing two-lesson rule."
              )

          if (
              "LESSON 1 PLAN:" not in prompt
              or "LESSON 2 PLAN:" not in prompt
          ):
              raise RuntimeError(
                  "Pair prompt is missing lesson sections."
              )

          # ------------------------------------------------
          # Verify the expected daily batching math.
          # ------------------------------------------------

          fake_daily_plan = []

          for number in range(1, 11):
              fake_daily_plan.append(
                  {
                      "slot": number,
                      "content_type": (
                          "reel"
                          if number % 2 == 1
                          else "educational_visual"
                      ),
                      "lesson_type": (
                          "professional_tip"
                      ),
                      "knowledge_path": (
                          "Plumbing Education"
                      ),
                      "knowledge_area": (
                          f"Test plumbing topic {number}"
                      ),
                      "lesson_number": number,
                  }
              )

          pair_count = len(fake_daily_plan) // 2

          if pair_count != 5:
              raise RuntimeError(
                  f"Expected 5 pairs, got {pair_count}."
              )

          expected_posts = pair_count * 2

          if expected_posts != 10:
              raise RuntimeError(
                  "Five pairs do not produce ten posts."
              )

          # ------------------------------------------------
          # Verify JSON serialization.
          # ------------------------------------------------

          serialized = json.dumps(
              attached,
              ensure_ascii=False,
              indent=2,
          )

          restored = json.loads(
              serialized
          )

          if len(restored) != 2:
              raise RuntimeError(
                  "Batch JSON serialization failed."
              )

          print()
          print(
              "=========================================="
          )
          print(
              "BATCH GENERATOR SAFE TEST PASSED"
          )
          print(
              "=========================================="
          )
          print(
              "Two-lesson batch validation: PASSED"
          )
          print(
              "Metadata attachment: PASSED"
          )
          print(
              "Pair prompt structure: PASSED"
          )
          print(
              "10 lessons -> 5 pairs: PASSED"
          )
          print(
              "JSON serialization: PASSED"
          )
          print()
          print(
              "REAL GEMINI API: NOT CALLED"
          )
          print(
              "CLOUDFLARE API: NOT CALLED"
          )
          print(
              "INSTAGRAM API: NOT CALLED"
          )
          print(
              "=========================================="
          )
          PY

      - name: Test daily content engine safely
        run: |
          python - <<'PY'
          import json
          import shutil
          import sys
          import tempfile
          import types
          from pathlib import Path

          from PIL import Image

          fake_content_generator = types.ModuleType(
              "content_generator"
          )

          fake_image_generator = types.ModuleType(
              "image_generator"
          )

          generated_counter = {
              "content": 0,
              "images": 0,
          }

          def fake_create_content(
              topic,
              content_type="educational_visual",
              lesson_type=None,
              lesson_number=None,
              previous_lesson=None,
          ):
              generated_counter["content"] += 1

              number = generated_counter[
                  "content"
              ]

              return {
                  "title": (
                      f"Safe Plumbing Lesson {number}"
                  ),
                  "description": (
                      f"Educational test lesson "
                      f"about {topic}."
                  ),
                  "image_prompt": (
                      f"Realistic plumbing scene "
                      f"showing {topic}, vertical "
                      "9:16, no text, no logo."
                  ),
                  "hashtags": [
                      "#Plumbing",
                      "#PlumbingTips",
                  ],
                  "visual_story": (
                      f"Teaching {topic}."
                  ),
                  "on_image_text": {
                      "hook": (
                          f"Understand {topic}"
                      ),
                      "explanation": (
                          "Learn the principle "
                          "before fixing the problem."
                      ),
                      "callout": topic,
                      "takeaway": (
                          "Understand the cause."
                      ),
                  },
              }

          def fake_check_content(content):
              return True

          def fake_generate_image(
              prompt,
              output_file,
          ):
              generated_counter[
                  "images"
              ] += 1

              image = Image.new(
                  "RGB",
                  (1080, 1920),
                  "white",
              )

              image.save(
                  output_file,
                  quality=95,
              )

              return output_file

          def fake_make_vertical_image(
              input_file,
              output_file,
              on_image_text=None,
          ):
              shutil.copy2(
                  input_file,
                  output_file,
              )

              return output_file

          fake_content_generator.create_content = (
              fake_create_content
          )

          fake_content_generator.check_content = (
              fake_check_content
          )

          fake_image_generator.generate_image = (
              fake_generate_image
          )

          fake_image_generator.make_vertical_image = (
              fake_make_vertical_image
          )

          sys.modules[
              "content_generator"
          ] = fake_content_generator

          sys.modules[
              "image_generator"
          ] = fake_image_generator

          fake_reel_generator = types.ModuleType(
              "reel_generator"
          )

          def fake_generate_reel(
              input_file,
              output_file,
              duration=8,
              teaching_text=None,
          ):
              Path(output_file).write_bytes(
                  b"SAFE_TEST_REEL"
              )

              return output_file

          fake_reel_generator.generate_reel = (
              fake_generate_reel
          )

          sys.modules[
              "reel_generator"
          ] = fake_reel_generator

          from content_planner import (
              create_daily_plan,
          )

          from daily_content_engine import (
              generate_daily_content,
              save_daily_package,
              summarize_daily_content,
          )

          with tempfile.TemporaryDirectory() as temp:
              temp_path = Path(temp)

              history_file = (
                  temp_path
                  / "content_history.json"
              )

              output_directory = (
                  temp_path
                  / "daily_generated_content"
              )

              plan = create_daily_plan(
                  day_number=1,
                  history_file=history_file,
              )

              generated = (
                  generate_daily_content(
                      daily_plan=plan,
                      output_directory=(
                          output_directory
                      ),
                  )
              )

              if len(generated) != 10:
                  raise RuntimeError(
                      "Engine did not produce 10 posts."
                  )

              reels = [
                  item
                  for item in generated
                  if item["content_type"]
                  == "reel"
              ]

              visuals = [
                  item
                  for item in generated
                  if item["content_type"]
                  == "educational_visual"
              ]

              if len(reels) != 5:
                  raise RuntimeError(
                      "Engine did not produce 5 Reels."
                  )

              if len(visuals) != 5:
                  raise RuntimeError(
                      "Engine did not produce 5 visuals."
                  )

              for item in generated:
                  image_file = Path(
                      item["image_file"]
                  )

                  if not image_file.exists():
                      raise RuntimeError(
                          f"Missing image: {image_file}"
                      )

                  if item["content_type"] == "reel":
                      reel_file = Path(
                          item["reel_file"]
                      )

                      if not reel_file.exists():
                          raise RuntimeError(
                              f"Missing Reel: {reel_file}"
                          )

              package_file = (
                  temp_path
                  / "daily_generated_content.json"
              )

              save_daily_package(
                  generated,
                  package_file,
              )

              with package_file.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  package = json.load(file)

              if package["total_posts"] != 10:
                  raise RuntimeError(
                      "Package total is not 10."
                  )

              summary = (
                  summarize_daily_content(
                      generated
                  )
              )

              print()
              print(
                  "=========================================="
              )
              print(
                  "DAILY ENGINE REGRESSION TEST PASSED"
              )
              print(
                  "=========================================="
              )
              print(
                  f"Posts: "
                  f"{summary['total_posts']}"
              )
              print(
                  f"Reels: "
                  f"{summary['reels']}"
              )
              print(
                  f"Visuals: "
                  f"{summary['educational_visuals']}"
              )
              print(
                  f"Images: "
                  f"{summary['successful_images']}"
              )
              print(
                  f"Reels generated: "
                  f"{summary['successful_reels']}"
              )
              print(
                  "=========================================="
              )
          PY

      - name: Final result
        run: |
          echo "=========================================="
          echo "OROM PLAN1 SAFE TEST SUITE PASSED"
          echo "=========================================="
          echo "Planner: PASSED"
          echo "Planner rotation: PASSED"
          echo "Batch generator: PASSED"
          echo "10 lessons -> 5 pairs: PASSED"
          echo "Daily content engine: PASSED"
          echo "5 Reels + 5 visuals: PASSED"
          echo
          echo "Gemini API: NOT CALLED"
          echo "Cloudflare API: NOT CALLED"
          echo "Instagram API: NOT CALLED"
          echo
          echo "Production publishing: NOT RUN"
          echo "=========================================="
