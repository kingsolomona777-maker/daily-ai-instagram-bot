name: Orom Plan1 Test

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai requests Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          echo "FFmpeg is installed."

      - name: Check required project files
        run: |
          test -f main.py
          test -f content_generator.py
          test -f image_generator.py
          test -f reel_generator.py
          test -f content_history.json
          test -f latest_content.json
          echo "Required Orom Plan1 files are present."

      - name: Check Python syntax
        run: |
          python -m py_compile \
            main.py \
            content_generator.py \
            image_generator.py \
            reel_generator.py
          echo "Python syntax check passed."

      - name: Check JSON files
        run: |
          python -m json.tool content_history.json > /dev/null
          python -m json.tool latest_content.json > /dev/null
          echo "JSON validation passed."

      - name: Check project source files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              "main.py",
              "content_generator.py",
              "image_generator.py",
              "reel_generator.py"
          ]

          for filename in files:
              source = Path(filename).read_text(encoding="utf-8")
              ast.parse(source, filename=filename)
              print(f"Parsed successfully: {filename}")

          print("Project source files passed structural checks.")
          PY

      - name: Create temporary test image
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          width = 1080
          height = 1920

          image = Image.new("RGB", (width, height), "white")
          draw = ImageDraw.Draw(image)

          try:
              font_large = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  64
              )
              font_small = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  42
              )
          except OSError:
              font_large = ImageFont.load_default()
              font_small = ImageFont.load_default()

          draw.text(
              (width // 2, 600),
              "OROM PLAN1",
              font=font_large,
              anchor="mm",
              fill="black"
          )

          draw.text(
              (width // 2, 760),
              "REEL ENGINE TEST",
              font=font_large,
              anchor="mm",
              fill="black"
          )

          draw.text(
              (width // 2, 900),
              "Educational plumbing content",
              font=font_small,
              anchor="mm",
              fill="black"
          )

          image.save("reel_test_image.jpg", quality=95)

          print("Temporary test image created.")
          PY

      - name: Generate test Reel
        run: |
          python - <<'PY'
          from reel_generator import generate_reel

          output = generate_reel(
              input_file="reel_test_image.jpg",
              output_file="orom_plan1_test_reel.mp4",
              duration=8
          )

          print(f"Generated Reel: {output}")
          PY

      - name: Verify Reel
        run: |
          test -f orom_plan1_test_reel.mp4

          FILE_SIZE=$(stat -c%s orom_plan1_test_reel.mp4)

          echo "Reel file size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "Reel file is unexpectedly small."
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            orom_plan1_test_reel.mp4

          echo "Reel verification passed."

      - name: Upload test Reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orom-plan1-test-reel
          path: |
            orom_plan1_test_reel.mp4
            reel_test_image.jpg
          retention-days: 7

      - name: Final result
        run: |
          echo "=========================================="
          echo "OROM PLAN1 TEST PASSED"
          echo "=========================================="
          echo "Python checks: PASSED"
          echo "JSON checks: PASSED"
          echo "FFmpeg: PASSED"
          echo "Reel generation: PASSED"
          echo "Reel verification: PASSED"
          echo "Test Reel uploaded as artifact."
          echo
          echo "No Gemini API calls were made."
          echo "No Cloudflare API calls were made."
          echo "No Instagram API calls were made."
          echo "No production content was published."
          echo "No project files were modified."
          echo "=========================================="
