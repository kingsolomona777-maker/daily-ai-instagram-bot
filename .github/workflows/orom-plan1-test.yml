name: Orom Plan1 Test

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai requests Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          echo "FFmpeg is installed."

      - name: Check required project files
        run: |
          test -f main.py
          test -f content_generator.py
          test -f content_planner.py
          test -f daily_content_engine.py
          test -f image_generator.py
          test -f reel_generator.py
          test -f content_history.json
          test -f latest_content.json
          echo "Required Orom Plan1 files are present."

      - name: Check Python syntax
        run: |
          python -m py_compile \
            main.py \
            content_generator.py \
            content_planner.py \
            daily_content_engine.py \
            image_generator.py \
            reel_generator.py

          echo "Python syntax check passed."

      - name: Check JSON files
        run: |
          python -m json.tool content_history.json > /dev/null
          python -m json.tool latest_content.json > /dev/null
          echo "JSON validation passed."

      - name: Check project source files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              "main.py",
              "content_generator.py",
              "content_planner.py",
              "daily_content_engine.py",
              "image_generator.py",
              "reel_generator.py"
          ]

          for filename in files:
              source = Path(filename).read_text(encoding="utf-8")
              ast.parse(source, filename=filename)
              print(f"Parsed successfully: {filename}")

          print("Project source files passed structural checks.")
          PY

      - name: Test 10-post content planner
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile

          from content_planner import (
              create_daily_plan,
              validate_daily_plan,
              print_daily_plan,
          )

          with tempfile.TemporaryDirectory() as temp_dir:
              history_file = Path(temp_dir) / "content_history.json"

              plan = create_daily_plan(
                  day_number=1,
                  history_file=history_file,
              )

              print_daily_plan(plan)

              if not validate_daily_plan(plan):
                  raise RuntimeError(
                      "10-post daily plan validation failed."
                  )

              reels = [
                  item
                  for item in plan
                  if item["content_type"] == "reel"
              ]

              visuals = [
                  item
                  for item in plan
                  if item["content_type"] == "educational_visual"
              ]

              if len(plan) != 10:
                  raise RuntimeError(
                      f"Expected 10 posts, got {len(plan)}."
                  )

              if len(reels) != 5:
                  raise RuntimeError(
                      f"Expected 5 Reels, got {len(reels)}."
                  )

              if len(visuals) != 5:
                  raise RuntimeError(
                      f"Expected 5 visuals, got {len(visuals)}."
                  )

              print()
              print("==========================================")
              print("10-POST PLANNER TEST PASSED")
              print("==========================================")
              print("Total posts: 10")
              print("Reels: 5")
              print("Educational visuals: 5")
              print("==========================================")
          PY

      - name: Test planner rotation
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile

          from content_planner import create_daily_plan

          with tempfile.TemporaryDirectory() as temp_dir:
              history_file = Path(temp_dir) / "content_history.json"

              plan_day_1 = create_daily_plan(
                  day_number=1,
                  history_file=history_file,
              )

              plan_day_2 = create_daily_plan(
                  day_number=2,
                  history_file=history_file,
              )

              path_1 = plan_day_1[0]["knowledge_path"]
              path_2 = plan_day_2[0]["knowledge_path"]

              print(f"Day 1 knowledge path: {path_1}")
              print(f"Day 2 knowledge path: {path_2}")

              if path_1 == path_2:
                  raise RuntimeError(
                      "Knowledge path did not rotate between days."
                  )

              print("Planner rotation passed.")
          PY

      - name: Test daily content engine safely
        run: |
          python - <<'PY'
          import json
          import shutil
          import sys
          import tempfile
          import types
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont

          # --------------------------------------------------
          # Create safe fake AI/image modules.
          # No Gemini, Cloudflare or Instagram is contacted.
          # --------------------------------------------------

          fake_content_generator = types.ModuleType(
              "content_generator"
          )

          fake_image_generator = types.ModuleType(
              "image_generator"
          )

          generated_counter = {
              "content": 0,
              "images": 0,
          }

          def fake_create_content(
              topic,
              content_type="educational_visual",
              lesson_type=None,
              lesson_number=None,
              previous_lesson=None,
          ):
              generated_counter["content"] += 1

              number = generated_counter["content"]

              return {
                  "title": (
                      f"Safe Plumbing Lesson {number}: {topic}"
                  ),
                  "description": (
                      f"Educational test lesson about {topic}. "
                      "This content was generated using the "
                      "safe offline test system."
                  ),
                  "image_prompt": (
                      f"A realistic professional plumbing scene "
                      f"showing {topic}, physically accurate "
                      "materials and pipe geometry, vertical "
                      "9:16 composition, no text, no logo, "
                      "no watermark."
                  ),
                  "hashtags": [
                      "#Plumbing",
                      "#PlumbingTips",
                      "#OromPlan1"
                  ],
                  "visual_story": (
                      f"A clear educational demonstration of "
                      f"{topic}."
                  ),
                  "on_image_text": {
                      "hook": (
                          f"Understand {topic}"
                      ),
                      "explanation": (
                          "Knowing the principle helps prevent "
                          "common plumbing problems."
                      ),
                      "callout": topic,
                      "takeaway": (
                          "Understand the cause before fixing "
                          "the symptom."
                      )
                  }
              }

          def fake_check_content(content):
              required = [
                  "title",
                  "description",
                  "image_prompt",
                  "hashtags",
                  "visual_story",
                  "on_image_text",
              ]

              return all(
                  field in content
                  for field in required
              )

          def fake_generate_image(
              prompt,
              output_file
          ):
              generated_counter["images"] += 1

              width = 1080
              height = 1920

              image = Image.new(
                  "RGB",
                  (width, height),
                  "white"
              )

              draw = ImageDraw.Draw(image)

              try:
                  font_large = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans-Bold.ttf",
                      60
                  )

                  font_small = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans.ttf",
                      38
                  )
              except OSError:
                  font_large = ImageFont.load_default()
                  font_small = ImageFont.load_default()

              draw.text(
                  (width // 2, 650),
                  "OROM PLAN1",
                  font=font_large,
                  anchor="mm",
                  fill="black"
              )

              draw.text(
                  (width // 2, 800),
                  "10-POST ENGINE TEST",
                  font=font_large,
                  anchor="mm",
                  fill="black"
              )

              draw.text(
                  (width // 2, 950),
                  "SAFE OFFLINE GENERATION",
                  font=font_small,
                  anchor="mm",
                  fill="black"
              )

              image.save(
                  output_file,
                  quality=95
              )

              return output_file

          def fake_make_vertical_image(
              input_file,
              output_file,
              on_image_text=None,
          ):
              shutil.copy2(
                  input_file,
                  output_file
              )

              return output_file

          fake_content_generator.create_content = (
              fake_create_content
          )

          fake_content_generator.check_content = (
              fake_check_content
          )

          fake_image_generator.generate_image = (
              fake_generate_image
          )

          fake_image_generator.make_vertical_image = (
              fake_make_vertical_image
          )

          sys.modules["content_generator"] = (
              fake_content_generator
          )

          sys.modules["image_generator"] = (
              fake_image_generator
          )

          # Import the real daily content engine after
          # replacing the API-dependent modules.
          from daily_content_engine import (
              generate_daily_content,
              save_daily_package,
              summarize_daily_content,
          )

          from content_planner import (
              create_daily_plan,
          )

          with tempfile.TemporaryDirectory() as temp_dir:
              temp_path = Path(temp_dir)

              history_file = (
                  temp_path / "content_history.json"
              )

              output_directory = (
                  temp_path / "daily_generated_content"
              )

              plan = create_daily_plan(
                  day_number=1,
                  history_file=history_file,
              )

              generated_posts = generate_daily_content(
                  daily_plan=plan,
                  output_directory=output_directory,
              )

              if len(generated_posts) != 10:
                  raise RuntimeError(
                      "Daily engine did not generate 10 posts."
                  )

              reels = [
                  item
                  for item in generated_posts
                  if item["content_type"] == "reel"
              ]

              visuals = [
                  item
                  for item in generated_posts
                  if item["content_type"]
                  == "educational_visual"
              ]

              if len(reels) != 5:
                  raise RuntimeError(
                      f"Expected 5 Reels, got {len(reels)}."
                  )

              if len(visuals) != 5:
                  raise RuntimeError(
                      f"Expected 5 visuals, got {len(visuals)}."
                  )

              for item in generated_posts:
                  image_file = Path(
                      item["image_file"]
                  )

                  if not image_file.exists():
                      raise RuntimeError(
                          f"Missing image: {image_file}"
                      )

                  if item["content_type"] == "reel":
                      reel_file = Path(
                          item["reel_file"]
                      )

                      if not reel_file.exists():
                          raise RuntimeError(
                              f"Missing Reel: {reel_file}"
                          )

              package_file = (
                  temp_path /
                  "daily_generated_content.json"
              )

              save_daily_package(
                  generated_posts,
                  package_file,
              )

              if not package_file.exists():
                  raise RuntimeError(
                      "Daily package JSON was not created."
                  )

              with package_file.open(
                  "r",
                  encoding="utf-8"
              ) as file:
                  package = json.load(file)

              if package["total_posts"] != 10:
                  raise RuntimeError(
                      "Saved package does not contain 10 posts."
                  )

              if package["reels"] != 5:
                  raise RuntimeError(
                      "Saved package does not contain 5 Reels."
                  )

              if package["educational_visuals"] != 5:
                  raise RuntimeError(
                      "Saved package does not contain 5 visuals."
                  )

              summary = summarize_daily_content(
                  generated_posts
              )

              print()
              print("==========================================")
              print("DAILY CONTENT ENGINE TEST PASSED")
              print("==========================================")
              print(
                  f"Total posts: "
                  f"{summary['total_posts']}"
              )
              print(
                  f"Reels: "
                  f"{summary['reels']}"
              )
              print(
                  f"Educational visuals: "
                  f"{summary['educational_visuals']}"
              )
              print(
                  f"Images generated: "
                  f"{summary['successful_images']}"
              )
              print(
                  f"Reels generated: "
                  f"{summary['successful_reels']}"
              )
              print("Package JSON: PASSED")
              print("==========================================")
              print()
              print(
                  "No Gemini API calls were made."
              )
              print(
                  "No Cloudflare API calls were made."
              )
              print(
                  "No Instagram API calls were made."
              )
          PY

      - name: Verify generated test Reels
        run: |
          echo "Checking generated test Reel files..."

          find /tmp -type f -name "*.mp4" -print 2>/dev/null || true

          echo "Daily engine generated its test content successfully."

      - name: Create temporary main.py integration environment
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          test_dir = Path("integration_test")
          test_dir.mkdir(exist_ok=True)

          shutil.copy2(
              "main.py",
              test_dir / "main.py"
          )

          shutil.copy2(
              "reel_generator.py",
              test_dir / "reel_generator.py"
          )

          print(
              "Temporary main.py integration "
              "environment created."
          )
          PY

      - name: Test main.py Reel integration safely
        run: |
          python - <<'PY'
          import json
          import os
          import runpy
          import shutil
          import sys
          import types
          from pathlib import Path

          ROOT = Path.cwd()
          TEST_DIR = ROOT / "integration_test"

          fake_content_generator = types.ModuleType(
              "content_generator"
          )

          fake_image_generator = types.ModuleType(
              "image_generator"
          )

          def fake_create_content(topic):
              return {
                  "title": "Test Plumbing Lesson",
                  "description": (
                      "Safe automated integration test."
                  ),
                  "image_prompt": (
                      "A realistic professional plumbing scene."
                  ),
                  "hashtags": [
                      "#Plumbing",
                      "#PlumbingTips",
                      "#OromPlan1"
                  ],
                  "visual_story": (
                      "A realistic plumbing demonstration."
                  ),
                  "on_image_text": {
                      "hook": (
                          "Small plumbing problems can become expensive."
                      ),
                      "explanation": (
                          "Learn the warning signs early."
                      ),
                      "callout": "Check the warning signs",
                      "takeaway": (
                          "Fix the cause, not only the symptom."
                      )
                  }
              }

          def fake_check_content(content):
              return True

          def fake_generate_image(
              prompt,
              output_file
          ):
              from PIL import Image

              image = Image.new(
                  "RGB",
                  (1080, 1920),
                  "white"
              )

              image.save(
                  output_file,
                  quality=95
              )

              return output_file

          def fake_make_vertical_image(
              input_file,
              output_file,
              on_image_text=None,
          ):
              shutil.copy2(
                  input_file,
                  output_file
              )

              return output_file

          fake_content_generator.create_content = (
              fake_create_content
          )

          fake_content_generator.check_content = (
              fake_check_content
          )

          fake_image_generator.generate_image = (
              fake_generate_image
          )

          fake_image_generator.make_vertical_image = (
              fake_make_vertical_image
          )

          sys.modules["content_generator"] = (
              fake_content_generator
          )

          sys.modules["image_generator"] = (
              fake_image_generator
          )

          os.environ[
              "OROM_PLAN1_GENERATE_REEL"
          ] = "true"

          original_directory = Path.cwd()

          try:
              os.chdir(TEST_DIR)

              runpy.run_path(
                  "main.py",
                  run_name="__main__"
              )

          finally:
              os.chdir(original_directory)

          latest_file = (
              TEST_DIR /
              "latest_content.json"
          )

          reel_file = (
              TEST_DIR /
              "orom_plan1_reel.mp4"
          )

          if not latest_file.exists():
              raise RuntimeError(
                  "latest_content.json was not created."
              )

          if not reel_file.exists():
              raise RuntimeError(
                  "main.py did not create the Reel."
              )

          with latest_file.open(
              "r",
              encoding="utf-8"
          ) as file:
              latest = json.load(file)

          if latest.get("reel_enabled") is not True:
              raise RuntimeError(
                  "Reel generation was not enabled."
              )

          if latest.get("reel_file") != (
              "orom_plan1_reel.mp4"
          ):
              raise RuntimeError(
                  "Unexpected Reel filename."
              )

          print()
          print("==========================================")
          print("MAIN.PY REEL INTEGRATION TEST PASSED")
          print("==========================================")
          print("Reel generated successfully.")
          print("==========================================")
          PY

      - name: Verify integrated Reel
        run: |
          test -f integration_test/orom_plan1_reel.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            integration_test/orom_plan1_reel.mp4

          echo "Integrated Reel verification passed."

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orom-plan1-safe-test-results
          path: |
            integration_test/orom_plan1_reel.mp4
          retention-days: 7

      - name: Final result
        run: |
          echo "=========================================="
          echo "OROM PLAN1 SAFE TEST SUITE PASSED"
          echo "=========================================="
          echo "Python syntax: PASSED"
          echo "JSON validation: PASSED"
          echo "10-post planner: PASSED"
          echo "Planner rotation: PASSED"
          echo "Daily content engine: PASSED"
          echo "10-post generation simulation: PASSED"
          echo "Reel generation: PASSED"
          echo "main.py integration: PASSED"
          echo "FFmpeg verification: PASSED"
          echo
          echo "No Gemini API calls were made."
          echo "No Cloudflare API calls were made."
          echo "No Instagram API calls were made."
          echo "No production content was published."
          echo "No production files were modified."
          echo "=========================================="
