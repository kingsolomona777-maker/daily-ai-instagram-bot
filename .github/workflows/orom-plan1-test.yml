name: Orom Plan1 Test

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai requests Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          echo "FFmpeg is installed."

      - name: Check required project files
        run: |
          test -f main.py
          test -f content_generator.py
          test -f image_generator.py
          test -f reel_generator.py
          test -f content_history.json
          test -f latest_content.json
          echo "Required Orom Plan1 files are present."

      - name: Check Python syntax
        run: |
          python -m py_compile \
            main.py \
            content_generator.py \
            image_generator.py \
            reel_generator.py

          echo "Python syntax check passed."

      - name: Check JSON files
        run: |
          python -m json.tool content_history.json > /dev/null
          python -m json.tool latest_content.json > /dev/null
          echo "JSON validation passed."

      - name: Check project source files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              "main.py",
              "content_generator.py",
              "image_generator.py",
              "reel_generator.py"
          ]

          for filename in files:
              source = Path(filename).read_text(encoding="utf-8")
              ast.parse(source, filename=filename)
              print(f"Parsed successfully: {filename}")

          print("Project source files passed structural checks.")
          PY

      - name: Create temporary test environment
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          test_dir = Path("integration_test")
          test_dir.mkdir()

          shutil.copy2("main.py", test_dir / "main.py")
          shutil.copy2("reel_generator.py", test_dir / "reel_generator.py")

          print("Temporary integration test environment created.")
          PY

      - name: Test main.py Reel integration safely
        run: |
          python - <<'PY'
          import json
          import os
          import runpy
          import shutil
          import sys
          import tempfile
          import types
          from pathlib import Path

          ROOT = Path.cwd()
          TEST_DIR = ROOT / "integration_test"

          fake_content_generator = types.ModuleType("content_generator")
          fake_image_generator = types.ModuleType("image_generator")

          def fake_create_content(topic):
              return {
                  "title": "Test Plumbing Lesson",
                  "description": (
                      "This is a safe automated test of the Orom Plan1 "
                      "educational content pipeline."
                  ),
                  "image_prompt": (
                      "A realistic professional plumbing scene showing "
                      "a clean sink drainage connection."
                  ),
                  "hashtags": [
                      "#Plumbing",
                      "#PlumbingTips",
                      "#OromPlan1"
                  ],
                  "visual_story": (
                      "A plumber inspecting a realistic sink drainage "
                      "connection."
                  ),
                  "on_image_text": {
                      "hook": "Small plumbing problems can become expensive.",
                      "explanation": (
                          "Learning the warning signs early can help "
                          "prevent bigger plumbing damage."
                      ),
                      "callout": "Check the warning signs",
                      "takeaway": (
                          "Fix the cause early, not only the symptom."
                      )
                  }
              }

          def fake_check_content(content):
              return True

          def fake_generate_image(prompt, output_file):
              from PIL import Image, ImageDraw, ImageFont

              width = 1080
              height = 1920

              image = Image.new("RGB", (width, height), "white")
              draw = ImageDraw.Draw(image)

              try:
                  font_large = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans-Bold.ttf",
                      64
                  )
                  font_small = ImageFont.truetype(
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans.ttf",
                      42
                  )
              except OSError:
                  font_large = ImageFont.load_default()
                  font_small = ImageFont.load_default()

              draw.text(
                  (width // 2, 650),
                  "OROM PLAN1",
                  font=font_large,
                  anchor="mm",
                  fill="black"
              )

              draw.text(
                  (width // 2, 800),
                  "MAIN.PY REEL TEST",
                  font=font_large,
                  anchor="mm",
                  fill="black"
              )

              draw.text(
                  (width // 2, 930),
                  "Safe integration test",
                  font=font_small,
                  anchor="mm",
                  fill="black"
              )

              image.save(output_file, quality=95)

              return output_file

          def fake_make_vertical_image(
              input_file,
              output_file,
              on_image_text=None
          ):
              shutil.copy2(input_file, output_file)
              return output_file

          fake_content_generator.create_content = fake_create_content
          fake_content_generator.check_content = fake_check_content

          fake_image_generator.generate_image = fake_generate_image
          fake_image_generator.make_vertical_image = fake_make_vertical_image

          sys.modules["content_generator"] = fake_content_generator
          sys.modules["image_generator"] = fake_image_generator

          os.environ["OROM_PLAN1_GENERATE_REEL"] = "true"

          original_directory = Path.cwd()

          try:
              os.chdir(TEST_DIR)

              print("Running the real main.py with safe fake API functions...")
              runpy.run_path("main.py", run_name="__main__")

          finally:
              os.chdir(original_directory)

          latest_file = TEST_DIR / "latest_content.json"
          reel_file = TEST_DIR / "orom_plan1_reel.mp4"

          if not latest_file.exists():
              raise RuntimeError(
                  "latest_content.json was not created by main.py"
              )

          if not reel_file.exists():
              raise RuntimeError(
                  "main.py did not create the expected Reel file"
              )

          with latest_file.open("r", encoding="utf-8") as file:
              latest = json.load(file)

          if latest.get("reel_enabled") is not True:
              raise RuntimeError(
                  "main.py did not enable Reel generation"
              )

          if latest.get("reel_file") != "orom_plan1_reel.mp4":
              raise RuntimeError(
                  "main.py did not save the expected Reel filename"
              )

          reel_size = reel_file.stat().st_size

          if reel_size < 10000:
              raise RuntimeError(
                  f"Generated Reel is unexpectedly small: {reel_size} bytes"
              )

          print()
          print("==========================================")
          print("MAIN.PY REEL INTEGRATION TEST PASSED")
          print("==========================================")
          print(f"Reel file: {reel_file}")
          print(f"Reel size: {reel_size} bytes")
          print(f"Reel enabled: {latest.get('reel_enabled')}")
          print(f"Reel filename: {latest.get('reel_file')}")
          print("==========================================")
          PY

      - name: Verify integrated Reel
        run: |
          test -f integration_test/orom_plan1_reel.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            integration_test/orom_plan1_reel.mp4

          echo "Integrated Reel verification passed."

      - name: Upload integrated Reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orom-plan1-main-reel-integration
          path: |
            integration_test/orom_plan1_reel.mp4
            integration_test/instagram_image.jpg
          retention-days: 7

      - name: Final result
        run: |
          echo "=========================================="
          echo "OROM PLAN1 FULL REEL INTEGRATION TEST PASSED"
          echo "=========================================="
          echo "Python syntax: PASSED"
          echo "JSON validation: PASSED"
          echo "FFmpeg: PASSED"
          echo "main.py execution: PASSED"
          echo "Reel generation: PASSED"
          echo "Reel integration: PASSED"
          echo "Reel verification: PASSED"
          echo
          echo "No Gemini API calls were made."
          echo "No Cloudflare API calls were made."
          echo "No Instagram API calls were made."
          echo "No production content was published."
          echo "No production files were modified."
          echo "=========================================="
