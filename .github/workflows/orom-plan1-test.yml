name: Orom Plan1 Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check required project files
        run: |
          test -f main.py
          test -f content_generator.py
          test -f content_planner.py
          test -f content_batch_generator.py
          test -f daily_content_engine.py
          test -f image_generator.py
          test -f reel_generator.py
          echo "Required project files found."

      - name: Python syntax check
        run: |
            python -m py_compile \
            main.py \
            content_generator.py \
            content_planner.py \
            content_batch_generator.py \
            daily_content_engine.py \
            image_generator.py \
            reel_generator.py

            echo "Python syntax check passed."

      - name: JSON validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue

              try:
                  json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  print(f"VALID JSON: {path}")
              except Exception as exc:
                  raise SystemExit(
                      f"Invalid JSON file: {path}: {exc}"
                  )

          print("JSON validation passed.")
          PY

      - name: Test daily planner
        run: |
          python - <<'PY'
          from content_planner import (
              create_daily_plan,
              validate_daily_plan,
          )

          plan = create_daily_plan(day_number=1)

          assert len(plan) == 10
          assert validate_daily_plan(plan)

          reels = [
              item for item in plan
              if item["content_type"] == "reel"
          ]

          visuals = [
              item for item in plan
              if item["content_type"]
              == "educational_visual"
          ]

          assert len(reels) == 5
          assert len(visuals) == 5

          slots = [item["slot"] for item in plan]

          assert slots == list(range(1, 11))

          print("Daily planner test passed.")
          print("Posts: 10")
          print("Reels: 5")
          print("Educational visuals: 5")
          PY

      - name: Test planner rotation
        run: |
          python - <<'PY'
          from content_planner import choose_knowledge_path

          day1 = choose_knowledge_path(1)
          day2 = choose_knowledge_path(2)
          day7 = choose_knowledge_path(7)

          assert day1["name"] != day2["name"]
          assert day1["name"] == day7["name"]

          print("Planner rotation test passed.")
          print("Day 1:", day1["name"])
          print("Day 2:", day2["name"])
          print("Day 7:", day7["name"])
          PY

      - name: Test batch generator safely
        run: |
          python - <<'PY'
          import os
          import sys
          import types

          # The module checks for GEMINI_API_KEY during import.
          # This placeholder exists only inside this offline test.
          # No Gemini request is made.

          os.environ["GEMINI_API_KEY"] = (
              "safe-test-placeholder"
          )

          fake_generator = types.ModuleType(
              "content_generator"
          )

          fake_generator.MODEL_NAME = "fake-model"

          fake_generator.client = types.SimpleNamespace(
              models=types.SimpleNamespace()
          )

          def fake_create_content(*args, **kwargs):
              return {
                  "title": "Safe Test Plumbing Lesson",
                  "description": (
                      "A safe offline test lesson."
                  ),
                  "image_prompt": (
                      "Professional realistic plumbing scene."
                  ),
                  "hashtags": [
                      "#plumbing",
                      "#plumber"
                  ],
                  "visual_story": (
                      "Show the plumbing concept clearly."
                  ),
                  "on_image_text": {
                      "hook": (
                          "Learn this plumbing principle"
                      ),
                      "explanation": (
                          "This is a safe offline test."
                      ),
                      "callout": (
                          "Professional plumbing"
                      ),
                      "takeaway": (
                          "Good installation matters."
                      )
                  },
                  "lesson_type": "professional_tip",
                  "content_type": kwargs.get(
                      "content_type",
                      "educational_visual"
                  ),
                  "knowledge_area": (
                      "Professional Plumbing"
                  ),
                  "lesson_number": kwargs.get(
                      "lesson_number",
                      1
                  )
              }

          def fake_check_content(content):
              return True

          fake_generator.create_content = (
              fake_create_content
          )

          fake_generator.check_content = (
              fake_check_content
          )

          sys.modules["content_generator"] = (
              fake_generator
          )

          import content_batch_generator

          print(
              "Batch generator imported successfully."
          )
          print("Gemini was NOT called.")
          print(
              "Safe offline batch-generator test passed."
          )
          PY

      - name: Test complete batch generation safely
        run: |
          python - <<'PY'
          import importlib
          import json
          import os
          import sys
          import types

          # Required only because the real module checks
          # this variable when it is imported.
          os.environ["GEMINI_API_KEY"] = (
              "safe-test-placeholder"
          )

          def lesson(title, number):
              return {
                  "title": title,
                  "description": (
                      "A safe plumbing lesson."
                  ),
                  "image_prompt": (
                      "Professional realistic plumbing scene."
                  ),
                  "hashtags": [
                      "#plumbing",
                      "#education"
                  ],
                  "visual_story": (
                      "Show the plumbing principle clearly."
                  ),
                  "on_image_text": {
                      "hook": f"Hook {number}",
                      "explanation": (
                          f"Explanation {number}"
                      ),
                      "callout": f"Callout {number}",
                      "takeaway": f"Takeaway {number}"
                  }
              }

          class FakeResponse:
              text = json.dumps([
                  lesson("Lesson One", 1),
                  lesson("Lesson Two", 2)
              ])

          class FakeModels:
          def generate_content(
            self,
          model,
          contents,
          config=None,
          **kwargs
          ):
                  assert model

                  assert (
                      "LESSON 1 PLAN:"
                      in contents
                  )

                  assert (
                      "LESSON 2 PLAN:"
                      in contents
                  )

                  print(
                      "Fake Gemini request intercepted."
                  )

                  return FakeResponse()

          fake_generator = types.ModuleType(
              "content_generator"
          )

          fake_generator.MODEL_NAME = "fake-model"

          fake_generator.client = types.SimpleNamespace(
              models=FakeModels()
          )

          sys.modules["content_generator"] = (
              fake_generator
          )

          sys.modules.pop(
              "content_batch_generator",
              None
          )

          batch = importlib.import_module(
              "content_batch_generator"
          )

          # Replace the REAL Gemini client after import.
          # The placeholder key can therefore never be
          # sent to Google's API.
          batch.client = types.SimpleNamespace(
              models=FakeModels()
          )

          first = {
              "slot": 1,
              "content_type": "reel",
              "lesson_type": "problem_and_cause",
              "knowledge_area": "drainage systems"
          }

          second = {
              "slot": 2,
              "content_type": "educational_visual",
              "lesson_type": "how_it_works",
              "knowledge_area": "sink drainage"
          }

          result = batch.generate_content_pair(
              first,
              second
          )

          assert len(result) == 2

          assert (
              result[0]["title"]
              == "Lesson One"
          )

          assert (
              result[1]["title"]
              == "Lesson Two"
          )

          print(
              "Complete batch generation "
              "safe test passed."
          )

          print(
              "Gemini requests used: "
              "1 fake request"
          )

          print(
              "Lessons returned: 2"
          )
          PY

      - name: Test complete daily content engine safely
        run: |
          python - <<'PY'
          import sys
          import types
          import tempfile

          from pathlib import Path

          def raw_lesson(number):
              content_type = (
                  "reel"
                  if number % 2 == 1
                  else "educational_visual"
              )

              return {
                  "title": (
                      f"Test Lesson {number}"
                  ),
                  "description": (
                      "Safe offline test lesson."
                  ),
                  "image_prompt": (
                      "Professional plumbing scene."
                  ),
                  "hashtags": [
                      "#plumbing",
                      "#education"
                  ],
                  "visual_story": (
                      "Show the plumbing lesson."
                  ),
                  "on_image_text": {
                      "hook": (
                          f"Hook {number}"
                      ),
                      "explanation": (
                          f"Explanation {number}"
                      ),
                      "callout": (
                          f"Callout {number}"
                      ),
                      "takeaway": (
                          f"Takeaway {number}"
                      )
                  },
                  "content_type": content_type
              }

          fake_batch = types.ModuleType(
              "content_batch_generator"
          )

          def fake_generate_content_pair(
              first_item,
              second_item
          ):
              return [
                  raw_lesson(
                      first_item["slot"]
                  ),
                  raw_lesson(
                      second_item["slot"]
                  )
              ]

          def fake_attach_plan_metadata(
              generated,
              plan_items
          ):
              output = []

              for content, plan in zip(
                  generated,
                  plan_items
              ):
                  item = dict(content)

                  item.update({
                      "slot": plan["slot"],
                      "role": plan["role"],
                      "lesson_type": (
                          plan["lesson_type"]
                      ),
                      "knowledge_path": (
                          plan["knowledge_path"]
                      ),
                      "knowledge_area": (
                          plan["knowledge_area"]
                      ),
                      "lesson_number": (
                          plan["lesson_number"]
                      ),
                      "content_type": (
                          plan["content_type"]
                      )
                  })

                  output.append(item)

              return output

          fake_batch.generate_content_pair = (
              fake_generate_content_pair
          )

          fake_batch.attach_plan_metadata = (
              fake_attach_plan_metadata
          )

          sys.modules["content_batch_generator"] = (
              fake_batch
          )

          fake_content = types.ModuleType(
              "content_generator"
          )

          fake_content.check_content = (
              lambda content: True
          )

          sys.modules["content_generator"] = (
              fake_content
          )

          fake_image = types.ModuleType(
              "image_generator"
          )

          def fake_generate_image(
              prompt,
              output_file
          ):
              path = Path(output_file)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_bytes(
                  b"fake image"
              )

              return str(path)

          def fake_make_vertical_image(
              input_file,
              output_file,
              on_image_text
          ):
              path = Path(output_file)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_bytes(
                  b"fake vertical image"
              )

              return str(path)

          fake_image.generate_image = (
              fake_generate_image
          )

          fake_image.make_vertical_image = (
              fake_make_vertical_image
          )

          sys.modules["image_generator"] = (
              fake_image
          )

          fake_reel = types.ModuleType(
              "reel_generator"
          )

          def fake_generate_reel(**kwargs):
              path = Path(
                  kwargs["output_file"]
              )

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_bytes(
                  b"fake reel"
              )

              return str(path)

          fake_reel.generate_reel = (
              fake_generate_reel
          )

          sys.modules["reel_generator"] = (
              fake_reel
          )

          sys.modules.pop(
              "daily_content_engine",
              None
          )

          engine = __import__(
              "daily_content_engine"
          )

          plan = []

          for slot in range(1, 11):
              plan.append({
                  "slot": slot,
                  "content_type": (
                      "reel"
                      if slot % 2 == 1
                      else "educational_visual"
                  ),
                  "role": "test_role",
                  "lesson_type": "test_lesson",
                  "knowledge_path": "Test Path",
                  "knowledge_area": (
                      "test plumbing"
                  ),
                  "lesson_number": slot,
                  "previous_lesson": None
              })

          with tempfile.TemporaryDirectory() as temp_dir:
              posts = engine.generate_daily_content(
                  plan,
                  Path(temp_dir)
              )

              assert len(posts) == 10

              reels = [
                  post for post in posts
                  if post["content_type"] == "reel"
              ]

              visuals = [
                  post for post in posts
                  if post["content_type"]
                  == "educational_visual"
              ]

              assert len(reels) == 5
              assert len(visuals) == 5

              images = [
                  post for post in posts
                  if Path(
                      post["image_file"]
                  ).exists()
              ]

              reel_files = [
                  post for post in posts
                  if post["reel_enabled"]
                  and post["reel_file"]
                  and Path(
                      post["reel_file"]
                  ).exists()
              ]

              assert len(images) == 10
              assert len(reel_files) == 5

          print(
              "Daily content engine "
              "safe test passed."
          )

          print("Posts: 10")
          print("Reels: 5")
          print("Educational visuals: 5")
          print("Images: 10")
          print("Reel files: 5")
          print(
              "Real daily_content_engine executed."
          )
          print(
              "No real Gemini request used."
          )
          print(
              "No real image generation used."
          )
          print(
              "No real Reel generation used."
          )
          PY

      - name: Final result
        run: |
          echo "=========================================="
          echo "OROM PLAN1 TEST SUITE PASSED"
          echo "=========================================="
          echo "10-post planner: PASS"
          echo "Planner rotation: PASS"
          echo "Batch generator: PASS"
          echo "Complete batch generation: PASS"
          echo "Daily content engine: PASS"
          echo "=========================================="
