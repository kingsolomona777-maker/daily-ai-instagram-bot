name: Orom Plan1 - Reel Generator Test

on:
  workflow_dispatch:

jobs:
  reel-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Reel generator
        run: |
          test -f reel_generator.py
          python -m py_compile reel_generator.py
          echo "reel_generator.py syntax check passed"

      - name: Create test image
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          width = 1080
          height = 1920

          image = Image.new("RGB", (width, height), "white")
          draw = ImageDraw.Draw(image)

          font_large = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              72
          )

          font_medium = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              44
          )

          title = "PLUMBING LESSON"
          teaching = "A P-TRAP HELPS\nBLOCK SEWER GASES"
          takeaway = "KEEP THE TRAP FILLED\nWITH WATER"

          def centered_text(text, font, y):
              box = draw.multiline_textbbox(
                  (0, 0),
                  text,
                  font=font,
                  align="center",
                  spacing=12
              )

              text_width = box[2] - box[0]

              draw.multiline_text(
                  ((width - text_width) / 2, y),
                  text,
                  font=font,
                  fill="black",
                  align="center",
                  spacing=12
              )

          centered_text(title, font_large, 500)
          centered_text(teaching, font_medium, 800)
          centered_text(takeaway, font_medium, 1200)

          image.save("reel_test_image.jpg", quality=95)

          print("Test image created:", image.size)
          PY

      - name: Generate 8-second Reel
        run: |
          python - <<'PY'
          from reel_generator import generate_reel

          teaching_text = {
              "hook": "Why does a P-trap matter?",
              "teaching": (
                  "A P-trap holds water that helps prevent "
                  "sewer gases from entering the room."
              ),
              "takeaway": (
                  "Keep the trap filled with water "
                  "to maintain the protective seal."
              )
          }

          generate_reel(
              input_file="reel_test_image.jpg",
              output_file="orom_plan1_reel_test.mp4",
              duration=8,
              teaching_text=teaching_text
          )

          print("Reel generation completed")
          PY

      - name: Validate Reel
        run: |
          test -f orom_plan1_reel_test.mp4

          SIZE=$(stat -c%s orom_plan1_reel_test.mp4)

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: Reel file is unexpectedly small: $SIZE bytes"
            exit 1
          fi

          echo "Reel file size: $SIZE bytes"

          echo "Video information:"
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            orom_plan1_reel_test.mp4

          echo "Duration:"
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            orom_plan1_reel_test.mp4

          echo "Reel validation passed"

      - name: Upload Reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orom-plan1-reel-test
          path: |
            reel_test_image.jpg
            orom_plan1_reel_test.mp4

      - name: Final result
        run: |
          echo "======================================"
          echo "OROM PLAN1 REEL GENERATOR TEST PASSED"
          echo "======================================"
          echo "Gemini: NOT USED"
          echo "Cloudflare: NOT USED"
          echo "Instagram: NOT USED"
          echo "Audio: NOT USED"
          echo "Reel: GENERATED SUCCESSFULLY"
